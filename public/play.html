<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<title>MiSSiONS</title>
<link rel="stylesheet" href="/css/app.css?v=2.0.1">
<style>
/* Player side: no muted grey — secondary text + icons read full white. */
:root { --text-dim: var(--text); --text-muted: var(--text); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; background:var(--bg); }

/* ── Player header — mockup 01 pattern.
   3-col grid (1fr auto 1fr) so the centered wordmark stays dead-
   centered regardless of left/right widths. Left holds the score-pill
   and team name; center holds the Adventurerooms stamp + MiSSiONS
   wordmark + timer + team-name line; right holds chat/rules/lang
   icon-btns (kept per user direction; mockup 01 only shows lang). */
.play-topbar {
  display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; gap:10px;
  padding:14px 14px 10px;
  background:var(--bg3); border-bottom:1px solid var(--hairline);
  flex-shrink:0;
}
.ph-left  { justify-self:start; display:flex; align-items:center; min-width:0; }
.ph-right { justify-self:end;   display:flex; align-items:center; gap:6px; }
.ph-center{ text-align:center; line-height:1; }
.ph-center .ar-stamp{font:700 9px/1 var(--body);letter-spacing:.32em;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;}
.ph-center .play-wordmark{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.06em;color:var(--red);line-height:1;}
.ph-center .ph-meta{font:500 11px/1.4 var(--mono);color:var(--text-muted);margin-top:6px;display:inline-flex;gap:6px;align-items:center;justify-content:center;}
.ph-center .ph-sep{opacity:.4;}
.ph-center .play-team-name{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);font-family:var(--body);}
.play-timer { font-family:var(--mono); white-space:nowrap; }
.play-timer.urgent { color:var(--red); animation:pulse-red 1s infinite; }
.play-timer.paused { color:var(--text-muted); }

/* Mockup score-pill — star icon + mono score, hairline pill. */
.score-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--hairline);font:700 12px/1 var(--mono);color:var(--text);letter-spacing:.02em;white-space:nowrap;}
.score-pill svg{width:11px;height:11px;color:var(--orange);stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* Player icon-btn — 36px chip same as the GM topbar pattern. */
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--hairline);color:var(--text);cursor:pointer;font:700 11px/1 var(--body);letter-spacing:.06em;transition:color .12s,background .12s,border-color .12s;padding:0;position:relative;}
.icon-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.18);}
.icon-btn .icon{width:18px;height:18px;display:block;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.icon-btn.active{border-color:var(--orange);color:var(--orange);}

/* Legacy class names kept so JS-driven views (chat / rules / lightbox)
   that still query .topbar-btn don't break. */
.topbar-btn {
  background:var(--surface); border:1px solid var(--hairline); color:var(--text-dim);
  border-radius:var(--radius); padding:.4rem .65rem; cursor:pointer;
  font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  white-space:nowrap; flex-shrink:0; transition:color .12s,border-color .12s;
}
.topbar-btn:hover { border-color:rgba(255,255,255,0.18); color:var(--text); }
.topbar-btn.active { border-color:var(--red); color:var(--red-light); }
/* Back buttons inside the chat/rules overlays share a row with a 1.2rem
   heading. Match its size and undo the narrow-viewport fixed-width rule
   (otherwise "← Zurück" gets clipped to 36px wide). */
#chat-back-btn, #rules-back-btn {
  width:auto !important;
  padding:.5rem .9rem !important;
  font-size:1.05rem !important;
  display:inline-flex; align-items:center; gap:.4rem;
  line-height:1;          /* keep both glyphs on the same visual centre */
}
#chat-back-btn > *, #rules-back-btn > * { font-size:inherit; line-height:1; }
/* SVG back arrow — natively centred by viewBox geometry, no glyph baseline
   weirdness like the "←" Unicode character. */
.back-arrow { width:.95em; height:.95em; flex-shrink:0; display:inline-block; }
.back-arrow svg { display:block; width:100%; height:100%; }
/* Narrow phones — shrink wordmark + chip + icon-btns so the header
   doesn't wrap or clip. The 3-col grid keeps the wordmark centered. */
@media (max-width:480px){
  .play-topbar { gap:6px; padding:10px 10px 8px; }
  .ph-center .play-wordmark { font-size:22px; }
  .ph-center .ar-stamp { font-size:8px; }
  .ph-center .ph-meta { font-size:10px; }
  .score-pill { padding:5px 9px; font-size:11px; }
  .icon-btn { width:32px; height:32px; }
  .icon-btn .icon { width:16px; height:16px; }
}

/* ── View switching ── */
/* Mockup 01 padding pattern: legend hugs its own 22px gutter, mission
   list uses 18px. showView('missions') sets display:flex inline, so
   flex-direction:column here keeps legend + missions-list stacked
   top-to-bottom. The scroll container itself only needs minimal padding —
   the real bottom breathing room is added to #missions-list so the gap
   plus margin between cards doesn't get eaten by the gesture bar / home
   indicator on phones. */
#view-missions { flex:1; min-height:0; overflow-y:auto; padding:0; display:flex; flex-direction:column; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
#missions-list { padding:0 18px calc(env(safe-area-inset-bottom,0px) + 4rem); display:flex; flex-direction:column; gap:10px; }
/* Use a fixed overlay so the chat input row is always anchored to the
   real viewport bottom — Android Chrome's keyboard otherwise pushes a
   flex-based input row off-screen, leaving "no chat bar" for players. */
#view-chat { position:fixed; left:0; right:0; top:0; bottom:0; background:var(--bg);
  display:none; flex-direction:column; overflow:hidden; z-index:550; }
#view-rules { position:fixed; inset:0; background:var(--bg3); z-index:600; display:none; flex-direction:column; }

/* ── Legend — mockup 01 pill style: centered, hairline border, icon/text
   items separated by 3px dots, all on one row. */
.legend-bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 14px;margin:14px 18px 16px;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;font-size:11px;color:var(--text-muted);letter-spacing:.06em;white-space:nowrap;overflow:hidden;}
.legend-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.legend-item svg{width:14px;height:14px;opacity:.85;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.legend-sep{width:3px;height:3px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}

/* ── Mission card — mockup 01 .mcard pattern. 3-col grid: type icon (28px),
   body (title + desc + task), points pill on the right. Whole card is
   tappable to open the detail modal. State variants: card--done (green
   check overlay), card--pending (orange tint), card--rejected (red dim). */
.p-mission-card{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:14px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;cursor:pointer;transition:border-color .12s,background .12s;}
.p-mission-card:hover{border-color:rgba(255,255,255,.18);background:var(--surface2);}
.p-mission-card.pending{border-color:rgba(232,95,30,.45);}
.p-mission-card.accepted{border-color:rgba(74,222,128,.45);box-shadow:0 0 0 1px rgba(74,222,128,.18) inset;}
.p-mission-card.rejected{border-color:rgba(212,43,43,.45);}
.mcard__type{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.mcard__type svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.mcard__body{min-width:0;}
.mcard__title{font:700 14px/1.2 var(--body);color:var(--text);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mcard__title .indoor{display:inline-flex;color:var(--text-dim);}
.mcard__title .indoor svg{width:13px;height:13px;}
.mcard__desc{font:400 12px/1.35 var(--body);color:var(--text-dim);margin-bottom:6px;}
.mcard__task{font:500 12px/1.35 var(--body);color:var(--text);display:flex;align-items:flex-start;gap:6px;}
.mcard__task .arrow{color:var(--orange);font-weight:700;flex-shrink:0;}
.mcard__points{align-self:start;font:700 11px/1 var(--mono);color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--hairline);padding:5px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;}
.mcard__check{align-self:start;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--green);margin-top:6px;}
.mcard__check svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
.mcard__pending-tag{align-self:start;font:700 9px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--orange);padding:5px 9px;border-radius:999px;background:rgba(232,95,30,.14);border:1px solid rgba(232,95,30,.3);white-space:nowrap;}
.mcard__rejected-msg{grid-column:1/-1;margin-top:8px;padding:8px 10px;background:rgba(212,43,43,.12);border-radius:6px;font:500 12px/1.4 var(--body);color:var(--red-light);}

/* ── Mission detail modal — opened when a player taps a mission card.
   Slides up from the bottom on phones. Holds the full mission body
   (title / description / task / points) + Take photo/video + Upload
   from gallery action buttons. */
#mission-detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:700;display:none;align-items:flex-end;justify-content:center;animation:md-fade .2s ease;}
#mission-detail-modal.is-open{display:flex;}
@keyframes md-fade{from{opacity:0;}to{opacity:1;}}
.md-card{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--hairline);border-radius:16px 16px 0 0;padding:24px 22px 32px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));position:relative;animation:md-slide-up .25s ease;}
@keyframes md-slide-up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.md-grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 16px;}
.md-close{position:absolute;top:14px;right:14px;background:transparent;border:0;color:var(--text-muted);cursor:pointer;width:32px;height:32px;font-size:20px;line-height:1;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.md-close:hover{color:var(--text);background:rgba(255,255,255,.06);}
.md-meta{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
.md-meta svg{width:18px;height:18px;color:var(--text-dim);stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.md-title{font:800 22px/1.2 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:16px;}
.md-label{font:700 10px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);margin:16px 0 6px;}
.md-desc{font:400 14px/1.55 var(--body);color:var(--text-dim);}
.md-task{font:500 14px/1.5 var(--body);color:var(--text);padding:12px 14px;background:var(--surface2);border:1px solid var(--hairline);border-radius:10px;display:flex;gap:8px;align-items:flex-start;}
.md-task .arrow{color:var(--orange);font-weight:700;flex-shrink:0;}
.md-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
.md-actions .md-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:10px;font:700 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:0;width:100%;}
.md-actions .md-btn--primary{background:var(--orange);color:#fff;box-shadow:0 10px 26px -10px var(--orange);}
.md-actions .md-btn--primary:hover{background:#ff7438;}
.md-actions .md-btn--secondary{background:var(--surface2);color:var(--text);border:1px solid var(--hairline);}
.md-actions .md-btn--secondary:hover{background:var(--bg2);}
.md-actions .md-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.md-state-note{margin-top:14px;padding:12px 14px;border-radius:10px;font:500 13px/1.5 var(--body);}
.md-state-note.pending{background:rgba(232,95,30,.1);border:1px solid rgba(232,95,30,.3);color:var(--orange);}
.md-state-note.accepted{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--green);}
.md-state-note.rejected{background:rgba(212,43,43,.12);border:1px solid rgba(212,43,43,.3);color:var(--red-light);}
.md-thumb{margin-top:14px;border-radius:10px;border:1px solid var(--hairline);overflow:hidden;}
.md-thumb img,.md-thumb video{width:100%;display:block;max-height:240px;object-fit:cover;}

/* Status pills */
.pill { display:inline-flex; align-items:center; gap:.3rem; padding:.2rem .6rem; border-radius:2px; font-size:.75rem; font-weight:700; text-transform:uppercase; }
.pill-pending  { background:#4a2000; color:var(--orange); }
.pill-accepted { background:#003318; color:var(--green); }
.pill-rejected { background:#4a0000; color:var(--red-light); }

/* Thumbnail */
.sub-thumb { width:56px; height:42px; object-fit:cover; border-radius:3px; border:1px solid var(--border); cursor:pointer; display:inline-block; }
.sub-thumb-video { width:56px; height:42px; object-fit:cover; border-radius:3px; border:1px solid var(--border); cursor:pointer; display:inline-block; vertical-align:middle; max-width:56px; }

/* Upload progress */
.upload-bar { height:3px; background:var(--red-dim); border-radius:2px; margin-top:.4rem; display:none; }
.upload-fill { height:100%; background:var(--red); width:0; transition:width .2s; }

/* ── Chat view ── */
#chat-messages { flex:1; min-height:0; overflow-y:auto; padding:.75rem; display:flex; flex-direction:column; gap:.4rem; -webkit-overflow-scrolling:touch; }
#chat-input-row { display:flex; gap:.5rem; padding:.6rem .75rem;
  padding-bottom:max(.6rem, env(safe-area-inset-bottom, .6rem));
  border-top:1px solid var(--border); background:var(--bg2);
  flex-shrink:0; flex:0 0 auto; width:100%;
  box-sizing:border-box; min-height:60px; }
#chat-input-row input { flex:1; min-width:0; }
#chat-input-row .btn { flex-shrink:0; }

/* ── Rules view ── */
#rules-scroll { flex:1; overflow-y:auto; padding:1rem; }
.rule-entry { padding:.5rem 0; border-bottom:1px solid var(--border); color:var(--text); line-height:1.6; }
.rule-entry:last-child { border-bottom:none; }

/* ── Camera modal ── */
#camera-modal { position:fixed; inset:0; background:#000; z-index:500; display:none; flex-direction:column; }
#cam-preview  { flex:1; width:100%; object-fit:cover; display:block; }
#cap-img { flex:1; width:100%; object-fit:contain; display:none; background:#000; }
#cap-vid { flex:1; width:100%; display:none; background:#000; }
.cam-bar { padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px)); background:#111; display:flex; gap:.75rem; align-items:center; justify-content:center; flex-shrink:0; box-sizing:border-box; width:100%; }
/* Review bar: two text buttons (retake / upload). Long localized labels
   (e.g. German "↺ Neu aufnehmen" + "✓ Hochladen") overflowed the viewport
   because the centered flex row had no width cap. Make the two share the
   row, shrinkable, never exceeding it. */
#cam-bar-review .btn { flex:1 1 0; min-width:0; max-width:50%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; justify-content:center; }
/* Capture bar: keep the round shutter intrinsic, let the side buttons
   shrink so cancel/flip labels can't push it off-center. */
#cam-bar-capture .topbar-btn { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#cam-bar-capture .shutter { flex:0 0 auto; }
.shutter {
  width:64px; height:64px; border-radius:50%; border:3px solid #fff;
  background:rgba(255,255,255,.15); cursor:pointer; font-size:1.5rem;
  display:flex; align-items:center; justify-content:center;
}
.shutter.recording { background:var(--red); border-color:var(--red); animation:pulse-red .8s infinite; }
#rec-dot { position:absolute; top:14px; left:14px; background:var(--red); color:#fff; padding:.15rem .5rem; border-radius:3px; font-size:.8rem; font-weight:700; display:none; }

/* ── Lightbox ── */
#lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:900; display:none; align-items:center; justify-content:center; cursor:pointer; }
#lightbox img, #lightbox video { max-width:96vw; max-height:92vh; border-radius:4px; }

/* ── GM Message popup ── */
#msg-popup {
  position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:1400;
  display:none; align-items:center; justify-content:center; padding:1.5rem;
}
.msg-popup-box {
  background:var(--bg3); border:2px solid var(--red); border-radius:var(--radius);
  padding:1.5rem; max-width:400px; width:100%; text-align:center;
  box-shadow:0 0 40px rgba(212,43,43,.4);
}
.msg-popup-box h3 { color:var(--red-light); margin-bottom:.75rem; font-size:1.4rem; }
.msg-popup-box p  { color:var(--text); margin-bottom:1.25rem; line-height:1.6; }

/* ── Rejection overlay ── */
#rejection-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:1500;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:2rem;
}
#rejection-overlay h2 { color:var(--red-light); font-size:2rem; margin-bottom:1rem; }
#rejection-overlay p  { color:var(--text); max-width:380px; margin:0 auto 1.5rem; line-height:1.6; }

/* ── Game over ── */
#gameover-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.97); z-index:1600;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:2rem;
}
#gameover-overlay h1 { font-size:clamp(3rem,12vw,6rem); color:var(--red); letter-spacing:.1em; }
#gameover-overlay p  { font-size:1.1rem; max-width:480px; margin:1rem auto; color:var(--text-dim); }

@keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:.5} }
</style>
</head>
<body>

<!-- ── PLAYER HEADER ── Mockup 01 player-header. 3-col grid so the
     wordmark stays dead-centered between the score on the left and the
     icon-btn chips on the right. Chat / Rules / Lang icons are kept
     (per user direction) alongside the lang button that the mockup shows. -->
<div class="play-topbar">
  <div class="ph-left">
    <span class="score-pill">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <span id="team-score-text">0 PT</span>
    </span>
  </div>
  <div class="ph-center">
    <div class="ar-stamp">Adventurerooms</div>
    <div class="play-wordmark"><span>MiSSi</span><span>ONS</span></div>
    <div class="ph-meta">
      <span class="play-timer" id="player-timer">--:--</span>
      <span class="ph-sep">·</span>
      <span class="play-team-name" id="team-name-text"></span>
    </div>
  </div>
  <div class="ph-right">
    <button class="icon-btn" id="btn-chat" onclick="showView('chat')" title="Chat" aria-label="Chat">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span id="chat-dot" style="position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--orange);display:none;border:2px solid var(--bg3);"></span>
    </button>
    <button class="icon-btn" id="btn-rules" onclick="showView('rules')" title="Rules" aria-label="Rules">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </button>
    <button class="icon-btn" id="btn-lang" onclick="cycleLang()" title="Language">DE</button>
  </div>
</div>

<!-- ── MISSIONS VIEW ── -->
<div id="view-missions">
  <!-- Legend — mockup 01: hairline pill, icon+label items separated by
       3px dot dividers. Margin handled by .legend-bar. -->
  <div class="legend-bar" id="legend-bar">
    <span class="legend-item" id="leg-photo-item">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span id="leg-photo">photo</span>
    </span>
    <span class="legend-sep"></span>
    <span class="legend-item" id="leg-video-item">
      <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span id="leg-video">video</span>
    </span>
    <span class="legend-sep"></span>
    <span class="legend-item" id="leg-indoor-item">
      <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>

const ALL_LANGS = ['de','en','fr','it','es'];
// LANGS is the currently-permitted set; the team-fetch payload narrows it
// down via setAllowedLangs() once we know the game's location restrictions.
// Until then we accept all five so the page renders something on first load.
let LANGS = ['de','en','fr','it','es'];
function t(k) { return (T[lang]||T.de)[k]||k; }

// Replace the active language allow-list. Called after fetching the team
// payload (which carries the location's `allowed_langs`). If the player's
// stored language isn't allowed at this location, snap to the first one.
function setAllowedLangs(csv) {
  let arr = String(csv || '').split(',').map(s => s.trim()).filter(l => ALL_LANGS.includes(l));
  // A 0- or 1-language allow-list strands players in one language with no
  // switcher and overrides their join-screen choice — almost never intended, so
  // treat anything under 2 languages as "no restriction" → all 5.
  if (arr.length < 2) arr = ALL_LANGS.slice();
  LANGS = arr;
  const btn = document.getElementById('btn-lang');
  if (btn) btn.style.display = LANGS.length > 1 ? '' : 'none';
  if (!LANGS.includes(lang)) {
    lang = LANGS[0];
    localStorage.setItem('m_lang', lang);
    applyTranslations();
    if (typeof loadMissions === 'function') loadMissions();
    if (typeof loadRules    === 'function') loadRules();
  }
}

function applyTranslations() {
  document.getElementById('btn-lang').textContent = lang.toUpperCase();
  document.getElementById('leg-photo').textContent = t('photo');
  document.getElementById('leg-video').textContent = t('video');
  document.getElementById('leg-indoor').textContent = t('indoor');
  const scl=document.getElementById('selfie-cta-label'); if(scl) scl.textContent = t('take_selfie')||'Team-Selfie aufnehmen';
  document.getElementById('rules-title').textContent = t('rules');
  // Update just the label spans inside the back buttons so the <span class="back-arrow">←</span>
  // wrapper stays intact (otherwise replacing textContent wipes the arrow span and
  // breaks the vertical-centre tweak).
  const rbl = document.getElementById('rules-back-label');
  if(rbl) rbl.textContent = (t('rules_back')||'Zurück').replace(/^←\s*/,'');
  const cb = document.getElementById('chat-back-label');
  if(cb) cb.textContent = (t('rules_back')||'Zurück').replace(/^←\s*/,'');
  document.getElementById('chat-send-btn').textContent = t('send');
  document.getElementById('chat-input').placeholder = t('chat_ph');
  document.getElementById('rej-title').textContent = t('rej_title');
  document.getElementById('rej-btn').textContent = t('rej_btn');
  document.getElementById('go-title').textContent = t('go');
  const ci=document.getElementById('chat-input');
  if(ci) ci.placeholder=t('chat_ph');
  const ub = document.getElementById('upload-btn');
  if (ub) ub.textContent = t('upload');
  // Camera modal buttons — `applyTranslations` runs on every language cycle
  // so the camera bar refreshes even if the modal is closed.
  const c1 = document.getElementById('cam-cancel-btn'); if(c1) c1.textContent = t('cancel');
  const c2 = document.getElementById('cam-flip-btn');   if(c2) c2.textContent = t('flip');
  const c3 = document.getElementById('cam-retake-btn'); if(c3) c3.textContent = t('retake');
}

function cycleLang() {
  lang = LANGS[(LANGS.indexOf(lang)+1) % LANGS.length];
  localStorage.setItem('m_lang', lang);
  applyTranslations();
  loadMissions();
  loadRules();
}

// ── View switching ────────────────────────────────────────────────────────────
function showView(v) {
  currentView = v;
  document.getElementById('view-missions').style.display = v==='missions' ? 'flex' : 'none';
  document.getElementById('view-chat').style.display     = v==='chat'     ? 'flex' : 'none';
  document.getElementById('view-rules').style.display    = v==='rules'    ? 'flex' : 'none';
  ['missions','chat','rules'].forEach(name => {
    const btn = document.getElementById(`btn-${name}`);
    if (btn) btn.classList.toggle('active', name===v);
  });
  if (v==='chat') {
    document.getElementById('chat-dot').style.display = 'none';
    scrollChat();
  }
  if (v==='rules') loadRules();
}

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const p = new URLSearchParams(window.location.search);
  gameId   = p.get('game')  || sessionStorage.getItem('gameId');
  teamId   = parseInt(p.get('team') || sessionStorage.getItem('teamId'));
  teamName = sessionStorage.getItem('teamName') || 'Team';
  if (!gameId || !teamId) { window.location.href='/'; return; }

  document.getElementById('team-name-text').textContent = teamName;
  applyTranslations();
  showView('missions');

  await loadMissions();
  await loadChatHistory();
  await loadRules();
  // Apply location icon settings
  try {
    const gameInfo = await fetch(`/api/games/${gameId}`).then(r=>r.json());
    const loc = gameInfo.location || {};
    const photoItem = document.getElementById('leg-photo-item');
    const videoItem = document.getElementById('leg-video-item');
    const indoorItem = document.getElementById('leg-indoor-item');
    if(photoItem && loc.allow_photo===0) photoItem.style.display='none';
    if(videoItem && loc.allow_video===0) videoItem.style.display='none';
    if(indoorItem && loc.allow_indoor===0) indoorItem.style.display='none';
  } catch(e) {}

  socket = io({ reconnection: true, reconnectionAttempts: Infinity, reconnectionDelay: 1000 });

  function joinRooms() {
    socket.emit('join_game', { gameId, teamId });
  }

  // Wait for connection before joining — fixes the "no real-time events" bug
  socket.on('connect', () => {
    joinRooms();
  });
  // Re-join after reconnect so timer/chat resume without page reload
  socket.on('reconnect', () => {
    joinRooms();
  });

  socket.on('timer_update', updateTimer);
  socket.on('timer_state',  updateTimer);
  socket.on('mission_accepted', ({ missionId }) => onAccepted(missionId));
  socket.on('mission_rejected', ({ missionId, message }) => onRejected(missionId, message));
  socket.on('chat_message', onChatMessage);
  socket.on('game_ended',   ({ messages, message }) => showGameOver((messages&&messages[lang])||message||''));
  socket.on('settings_updated', () => { loadMissions(); });

  // Fix Android keyboard pushing input off screen.
  // We re-anchor both <body> and the fixed chat overlay to the visual viewport
  // height so the chat input bar stays visible when the keyboard opens.
  function fixViewportHeight() {
    const vv = window.visualViewport;
    const h  = vv ? vv.height : window.innerHeight;
    document.body.style.height = h + 'px';
    document.body.style.maxHeight = h + 'px';
    const chat = document.getElementById('view-chat');
    if (chat) {
      chat.style.height = h + 'px';
      chat.style.top = (vv ? vv.offsetTop : 0) + 'px';
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fixViewportHeight);
    window.visualViewport.addEventListener('scroll', fixViewportHeight);
  }
  window.addEventListener('resize', fixViewportHeight);
  fixViewportHeight();
});

// ── Timer ─────────────────────────────────────────────────────────────────────
function updateTimer({ remaining, running }) {
  const el = document.getElementById('player-timer');
  const m  = Math.floor(remaining/60).toString().padStart(2,'0');
  const s  = (remaining%60).toString().padStart(2,'0');
  el.textContent = `${m}:${s}`;
  el.className = 'play-timer' + (remaining<=60&&running?' urgent' : !running?' paused':'');
}

// ── Missions ──────────────────────────────────────────────────────────────────
// Cache the latest mission payload by id so the detail modal can read full
// mission data on tap without re-fetching from the server.
let _missionMap = {};
async function loadMissions() {
  const data = await fetch(`/api/games/${gameId}/teams/${teamId}`).then(r=>r.json());
  // Apply the location's allowed-language restriction. Safe to call on every
  // loadMissions (no-op when nothing changes); the GM can edit the allow-list
  // mid-game and the player picks it up on next refresh without reload.
  if (data.allowed_langs) setAllowedLangs(data.allowed_langs);
  // Selfie shortcut: show the button only while the team has no selfie yet.
  const scw = document.getElementById('selfie-cta-wrap');
  if (scw) scw.style.display = data.selfie_path ? 'none' : 'block';
  // Update teamName from server (fixes reload showing 'Team')
  if (data.name) {
    teamName = data.name;
    sessionStorage.setItem('teamName', data.name);
    const nameEl = document.getElementById('team-name-text');
    if (nameEl) nameEl.textContent = data.name;
  }
  if (typeof data.score === 'number') updateScoreDisplay(data.score);
  const list = document.getElementById('missions-list');
  if (!data.missions || !data.missions.length) {
    list.innerHTML = `<div class="empty"><p>${t('no_missions')||'Keine Missionen gefunden.'}</p></div>`;
    _missionMap = {};
    return;
  }
  _missionMap = Object.fromEntries(data.missions.map(m => [m.mission_id, m]));
  list.innerHTML = data.missions.map(m => missionCard(m)).join('');
  // If the detail modal happens to be open on a mission whose status just
  // changed (e.g. submission accepted via socket), repaint it in place.
  const open = document.getElementById('mission-detail-modal');
  if (open && open.classList.contains('is-open') && _openMissionId && _missionMap[_openMissionId]) {
    openMissionDetail(_openMissionId);
  }
}

// Mockup 01 .mcard pattern. Whole card is tappable to open the detail
// modal. Status (done / pending / accepted / rejected) drives the border
// tint and the top-right overlay (green check, "PENDING" tag, etc).
function missionCard(m) {
  const icon   = m.media_type==='video' ? ICONS.video : ICONS.camera;
  const desc   = m[`description_${lang}`] || m.description_de || m.description_en || '';
  const task   = m[`task_${lang}`] || m.task_de || m.task_en || '';
  const status = m.status || 'open';
  const name   = m['name_'+lang] || m.mission_name || m.name || '';
  const indoor = m.is_indoor ? `<span class="indoor">${ICONS.house}</span>` : '';
  // State overlay (top-right). When a status tag is shown (pending /
   // rejected), it takes the points pill's slot — the points become a
   // secondary detail and the user cares about the status more.
   // Accepted keeps the points pill AND a green check sits next to it.
  let rightSlot;
  if (status === 'pending') {
    rightSlot = `<span class="mcard__pending-tag">${esc(t('pending')||'PENDING')}</span>`;
  } else if (status === 'rejected') {
    rightSlot = `<span class="mcard__pending-tag" style="color:var(--red-light);background:rgba(212,43,43,.12);border-color:rgba(212,43,43,.3);">${esc(t('rejected')||'REJECTED')}</span>`;
  } else if (status === 'accepted') {
    rightSlot = `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:start;"><span class="mcard__check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span><div class="mcard__points">+${m.points}pt</div></div>`;
  } else {
    rightSlot = `<div class="mcard__points">+${m.points}pt</div>`;
  }
  const stateClass = status === 'accepted' ? 'accepted' : status;
  return `<div class="p-mission-card ${stateClass}" id="mc-${m.mission_id}" onclick="openMissionDetail(${m.mission_id})" role="button" tabindex="0">
    <div class="mcard__type">${icon}</div>
    <div class="mcard__body">
      <div class="mcard__title">${esc(name)}${indoor}</div>
      ${desc ? `<div class="mcard__desc">${esc(desc)}</div>` : ''}
      ${task ? `<div class="mcard__task"><span class="arrow">→</span><span>${esc(task)}</span></div>` : ''}
    </div>
    ${rightSlot}
    <div class="upload-bar" id="ub-${m.mission_id}" style="grid-column:1/-1;"><div class="upload-fill" id="uf-${m.mission_id}"></div></div>
  </div>`;
}

// ── Mission detail modal ─────────────────────────────────────────────────────
// Opens when a player taps a mission card. Surfaces the full mission body
// + both action buttons (Take photo/video AND Upload from gallery) per
// user direction — keep the opening mechanic for missions, larger view
// for ease of reading.
let _openMissionId = null;
function openMissionDetail(missionId) {
  const m = _missionMap[missionId];
  if (!m) return;
  _openMissionId = missionId;
  const status = m.status || 'open';
  const name   = m['name_'+lang] || m.mission_name || m.name || '';
  const desc   = m[`description_${lang}`] || m.description_de || m.description_en || '';
  const task   = m[`task_${lang}`] || m.task_de || m.task_en || '';

  document.getElementById('md-title').textContent = name;
  document.getElementById('md-points').textContent = `+${m.points}pt`;
  document.getElementById('md-type-icon').innerHTML = m.media_type==='video' ? ICONS.video : ICONS.camera;
  document.getElementById('md-indoor-icon').innerHTML = m.is_indoor ? ICONS.house : '';
  document.getElementById('md-desc-label').textContent = t('description') || 'Beschreibung';
  document.getElementById('md-task-label').textContent = t('task') || 'Aufgabe';
  document.getElementById('md-desc').textContent = desc;
  document.getElementById('md-task').textContent = task;

  // Status note (pending / accepted / rejected) + media thumb if uploaded.
  const stateArea = document.getElementById('md-state-area');
  stateArea.innerHTML = '';
  if (status === 'pending')  stateArea.innerHTML = `<div class="md-state-note pending">${esc(t('pending_note')||'Warten auf Bewertung durch den Spielleiter.')}</div>`;
  else if (status === 'accepted') stateArea.innerHTML = `<div class="md-state-note accepted">${esc(t('accepted_note')||'Angenommen!')} +${m.points} PT</div>`;
  else if (status === 'rejected' && m.rejection_message) stateArea.innerHTML = `<div class="md-state-note rejected">${esc(m.rejection_message)}</div>`;
  if (m.media_path && (status==='pending' || status==='accepted')) {
    const src = `/uploads/${m.media_path}`;
    const isVid = m.media_type === 'video';
    stateArea.innerHTML += `<div class="md-thumb">${isVid
      ? `<video src="${src}" controls playsinline muted></video>`
      : `<img src="${src}" alt="" onclick="openLightbox('${src}',false)">`}</div>`;
  }

  // Action buttons — open or rejected gets Take photo/video + Upload.
  // Pending or accepted gets nothing (the state note covers it).
  const actions = document.getElementById('md-actions');
  if (status === 'open' || status === 'rejected') {
    const captureLbl = m.media_type === 'video' ? (t('take_video')||'Take video') : (t('take_photo')||'Take photo');
    const captureIcon = m.media_type === 'video'
      ? `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`
      : `<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11Z"/><circle cx="12" cy="13" r="4"/></svg>`;
    const accept = m.media_type === 'video' ? 'video/*' : 'image/*';
    const galleryLbl = t('gallery_upload') || 'Aus Galerie hochladen';
    actions.innerHTML = `
      <button type="button" class="md-btn md-btn--primary" onclick="closeMissionDetail();openCamera(${m.mission_id},'${m.media_type}')">
        ${captureIcon}
        ${esc(captureLbl)}
      </button>
      <label class="md-btn md-btn--secondary" style="cursor:pointer;">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        ${esc(galleryLbl)}
        <input type="file" accept="${accept}" style="display:none;" onchange="uploadFromGallery(event,${m.mission_id},'${m.media_type}');closeMissionDetail();">
      </label>`;
  } else {
    actions.innerHTML = '';
  }

  document.getElementById('mission-detail-modal').classList.add('is-open');
}
function closeMissionDetail() {
  document.getElementById('mission-detail-modal').classList.remove('is-open');
  _openMissionId = null;
}

// ── Camera ────────────────────────────────────────────────────────────────────
async function openCamera(missionId, type) {
  // Block if game has ended
  const gameState = await fetch(`/api/games/${gameId}`).then(r=>r.json()).catch(()=>null);
  if (gameState && gameState.status === 'ended') {
    toast(t('times_up')||'Die Zeit ist abgelaufen! Bitte zum vereinbarten Treffpunkt zurückkehren.', 'error');
    return;
  }
  selfieMode         = false;
  currentMissionId   = missionId;
  currentMissionType = type;
  document.getElementById('shutter-icon').textContent = type==='video' ? '🔴' : '📷';
  document.getElementById('camera-modal').style.display = 'flex';
  document.getElementById('cam-preview').style.display  = 'block';
  document.getElementById('cap-img').style.display      = 'none';
  document.getElementById('cap-vid').style.display      = 'none';
  document.getElementById('cam-bar-capture').style.display = 'flex';
  document.getElementById('cam-bar-review').style.display  = 'none';
  document.getElementById('rec-dot').style.display         = 'none';
  document.getElementById('shutter-btn').classList.remove('recording');
  capturedBlob = null;
  await startStream();
}

// Team selfie reuses the in-app camera (same getUserMedia path as missions)
// instead of a native `capture` file-input. The native intent launches the OS
// camera app, which on low-RAM phones evicts the backgrounded browser tab and
// surfaces Android's "Can't complete action due to low memory" — losing the
// shot. Keeping capture in-tab avoids that and lets us cap the resolution.
async function openSelfieCamera() {
  selfieMode         = true;
  useFront           = true;          // front camera for a team selfie
  currentMissionId   = null;
  currentMissionType = 'photo';
  document.getElementById('shutter-icon').textContent = '📷';
  document.getElementById('camera-modal').style.display = 'flex';
  document.getElementById('cam-preview').style.display  = 'block';
  document.getElementById('cap-img').style.display      = 'none';
  document.getElementById('cap-vid').style.display      = 'none';
  document.getElementById('cam-bar-capture').style.display = 'flex';
  document.getElementById('cam-bar-review').style.display  = 'none';
  document.getElementById('rec-dot').style.display         = 'none';
  document.getElementById('shutter-btn').classList.remove('recording');
  capturedBlob = null;
  await startStream();
}

async function startStream() {
  if (cameraStream) cameraStream.getTracks().forEach(t=>t.stop());
  const facingMode = useFront ? 'user' : 'environment';

  // For video: try with audio first, fall back to video-only if denied
  if (currentMissionType === 'video') {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
    } catch(e) {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: false });
        toast(t('no_mic')||'Mikrofon nicht verfügbar – kein Ton', 'warning');
      } catch(e2) {
        toast(t('cam_denied')||'Kamerazugriff verweigert', 'error');
        closeCamera();
        return;
      }
    }
  } else {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
    } catch(e) {
      toast(t('cam_denied')||'Kamerazugriff verweigert', 'error');
      closeCamera();
      return;
    }
  }
  document.getElementById('cam-preview').srcObject = cameraStream;
}

function flipCam() { useFront = !useFront; startStream(); }

async function doCapture() {
  if (currentMissionType === 'video') {
    const btn = document.getElementById('shutter-btn');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    } else {
      recordedChunks = [];
      // Detect supported MIME type
      const mimes = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
      capturedMimeType = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';
      try {
        mediaRecorder = new MediaRecorder(cameraStream, capturedMimeType ? { mimeType: capturedMimeType } : {});
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          capturedBlob = new Blob(recordedChunks, { type: capturedMimeType || 'video/webm' });
          capturedIsVideo = true;
          const vid = document.getElementById('cap-vid');
          revokeIfBlob(vid);
          const url = URL.createObjectURL(capturedBlob);
          vid.src = url; vid.style.display = 'block';
          document.getElementById('cam-preview').style.display = 'none';
          document.getElementById('cam-bar-capture').style.display = 'none';
          document.getElementById('cam-bar-review').style.display  = 'flex';
          document.getElementById('rec-dot').style.display          = 'none';
          btn.classList.remove('recording');
          document.getElementById('shutter-icon').textContent = '🔴';
        };
        mediaRecorder.start();
        btn.classList.add('recording');
        document.getElementById('rec-dot').style.display = 'block';
        document.getElementById('shutter-icon').textContent = '⏹';
      } catch(e) {
        toast((t('capture_failed')||'Aufnahme nicht möglich:') + ' ' + e.message, 'error');
      }
    }
  } else {
    // Photo — cap the canvas to a sane max edge so low-RAM phones don't run
    // out of memory: a 12MP frame is a ~48MB canvas buffer before the JPEG
    // encode even starts, which is enough to OOM a budget device.
    const video  = document.getElementById('cam-preview');
    const sw = video.videoWidth  || 1280;
    const sh = video.videoHeight || 720;
    const MAX = 1600;
    const scale = Math.min(1, MAX / Math.max(sw, sh));
    const cw = Math.max(1, Math.round(sw * scale));
    const ch = Math.max(1, Math.round(sh * scale));
    const canvas = document.createElement('canvas');
    canvas.width  = cw;
    canvas.height = ch;
    canvas.getContext('2d').drawImage(video, 0, 0, cw, ch);
    canvas.toBlob(blob => {
      capturedBlob = blob;
      capturedIsVideo = false;
      const img = document.getElementById('cap-img');
      revokeIfBlob(img);
      img.src = URL.createObjectURL(blob); img.style.display = 'block';
      document.getElementById('cam-preview').style.display  = 'none';
      document.getElementById('cam-bar-capture').style.display = 'none';
      document.getElementById('cam-bar-review').style.display  = 'flex';
    }, 'image/jpeg', 0.85);
  }
}

function retake() {
  capturedBlob = null;
  revokeIfBlob(document.getElementById('cap-img'));
  revokeIfBlob(document.getElementById('cap-vid'));
  document.getElementById('cam-preview').style.display  = 'block';
  document.getElementById('cap-img').style.display      = 'none';
  document.getElementById('cap-vid').style.display      = 'none';
  document.getElementById('cam-bar-capture').style.display = 'flex';
  document.getElementById('cam-bar-review').style.display  = 'none';
  document.getElementById('shutter-icon').textContent = currentMissionType==='video' ? '🔴' : '📷';
}

async function doUpload() {
  if (!capturedBlob) return;

  // Team selfie path: the in-app camera was opened in selfie mode, so post the
  // captured photo to the selfie endpoint and hide the CTA once it's saved.
  if (selfieMode) {
    const blob = capturedBlob;
    closeCamera();
    const fd = new FormData(); fd.append('media', blob, 'selfie.jpg');
    try {
      const r = await fetch(`/api/games/${gameId}/teams/${teamId}/selfie`, { method:'POST', body:fd }).then(r=>r.json());
      if (r && r.success) {
        const scw=document.getElementById('selfie-cta-wrap'); if(scw) scw.style.display='none';
        toast(t('selfie_saved')||'Selfie gespeichert','success');
      } else toast((r&&r.error)||t('error_generic')||'Fehler','error');
    } catch(err){ toast(t('error_generic')||'Fehler','error'); }
    return;
  }

  if (!currentMissionId) return;
  const blobToUpload = capturedBlob;
  const isVid        = capturedIsVideo;
  const ext          = isVid ? (capturedMimeType.includes('mp4') ? 'mp4' : 'webm') : 'jpg';
  closeCamera();

  const ub   = document.getElementById(`ub-${currentMissionId}`);
  const fill = document.getElementById(`uf-${currentMissionId}`);
  if (ub) ub.style.display = 'block';

  const form = new FormData();
  form.append('media', blobToUpload, `capture.${ext}`);

  const xhr = new XMLHttpRequest();
  xhr.upload.onprogress = e => {
    if (e.lengthComputable && fill) fill.style.width = `${(e.loaded/e.total*100).toFixed(0)}%`;
  };
  xhr.onload = () => {
    if (ub) ub.style.display = 'none';
    if (xhr.status === 200) {
      toast(t('uploading_review')||'Hochgeladen! Wird geprüft…', 'success');
      // Repaint from server truth (status is now 'pending'). The old code
      // hand-patched a non-existent `mf-` footer and only flipped the card
      // class, which left a stale status pill behind — same class of bug as
      // the accept handler.
      loadMissions();
    } else {
      toast(t('upload_failed')||'Upload fehlgeschlagen', 'error');
    }
  };
  xhr.onerror = () => { if(ub) ub.style.display='none'; toast(t('upload_failed')||'Upload fehlgeschlagen','error'); };
  xhr.open('POST', `/api/games/${gameId}/teams/${teamId}/missions/${currentMissionId}/upload`);
  xhr.send(form);
}

function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  if (mediaRecorder && mediaRecorder.state !== 'inactive') { try { mediaRecorder.stop(); } catch(e){} }
  document.getElementById('camera-modal').style.display = 'none';
}

// Release an <img>/<video> object-URL so the browser can reclaim the blob.
// Critical on low-RAM phones where stale preview blobs pile up across retakes.
function revokeIfBlob(el) {
  try { if (el && el.src && el.src.startsWith('blob:')) URL.revokeObjectURL(el.src); } catch(e){}
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openLightbox(url, isVid) {
  let rotation = 0;
  const lb  = document.getElementById('lightbox');
  const img = document.getElementById('lb-img');
  const vid = document.getElementById('lb-vid');
  const rotBtnEl = document.getElementById('lb-rotate');
  if(rotBtnEl) rotBtnEl.onclick = (e) => {
    e.stopPropagation();
    rotation = (rotation+90)%360;
    if(isVid) vid.style.transform=`rotate(${rotation}deg)`;
    else img.style.transform=`rotate(${rotation}deg)`;
  };
  img.style.transform=''; vid.style.transform=''; // reset rotation
  if (isVid) { img.style.display='none'; vid.src=url; vid.style.display='block'; }
  else        { vid.style.display='none'; img.src=url; img.style.display='block'; }
  lb.style.display = 'flex';
}

// ── Chat ──────────────────────────────────────────────────────────────────────
async function loadChatHistory() {
  const msgs = await fetch(`/api/games/${gameId}/chat?teamId=${teamId}`).then(r=>r.json());
  const box  = document.getElementById('chat-messages');
  box.innerHTML = msgs.map(m => bubble(m)).join('');
  scrollChat();
}

// `team_id`/`teamId` is NULL on broadcast messages (sent to /game_<id>) and a
// number on team-targeted DMs. Surface a small "📢 Broadcast" badge so the
// player can tell which is which at a glance.
function _isBroadcast(m){
  const tid = m.teamId !== undefined ? m.teamId : m.team_id;
  return tid == null;
}
function bubble(m) {
  const fromGm = m.from_gm===1 || m.from_gm===true;
  const broadcast = fromGm && _isBroadcast(m);
  const time   = new Date(m.created_at||m.timestamp||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const sender = fromGm ? 'Gamemaster' : (t('you')||'Du');
  const tag = broadcast ? `<span class="chat-tag chat-tag-broadcast">📢 ${t('broadcast')||'Broadcast'}</span>` : '';
  return `<div class="chat-bubble ${fromGm?'from-gm':'from-player'}${broadcast?' broadcast':''}">
    <div class="chat-meta">${sender} · ${time} ${tag}</div>
    ${esc(m.content)}
  </div>`;
}

// Soft two-note "ping" played whenever a GM message (direct or broadcast)
// reaches the player. Synthesised via WebAudio (no audio asset); the context is
// primed on the player's first interaction to satisfy the autoplay rule.
let _msgAudioCtx = null;
function _ensureMsgAudio(){
  try {
    if(!_msgAudioCtx) _msgAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(_msgAudioCtx.state === 'suspended') _msgAudioCtx.resume().catch(()=>{});
  } catch(e){}
  return _msgAudioCtx;
}
function playGmMessageTone(){
  const ctx = _ensureMsgAudio(); if(!ctx) return;
  const now = ctx.currentTime;
  [[784,0],[1047,0.12]].forEach(([f,d]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
    const tt = now+d;
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(0.22, tt+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, tt+0.3);
    o.start(tt); o.stop(tt+0.32);
  });
}
window.addEventListener('pointerdown', () => { _ensureMsgAudio(); }, { once:true });
function onChatMessage(msg) {
  const fromGm = msg.fromGm===1 || msg.fromGm===true;

  // Skip player's own messages - already added optimistically in sendChat()
  if (!fromGm) return;
  playGmMessageTone();

  const box  = document.getElementById('chat-messages');
  const time = new Date(msg.timestamp||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const broadcast = _isBroadcast(msg);
  const tag = broadcast ? `<span class="chat-tag chat-tag-broadcast">📢 ${t('broadcast')||'Broadcast'}</span>` : '';
  box.insertAdjacentHTML('beforeend', `<div class="chat-bubble from-gm${broadcast?' broadcast':''}">
    <div class="chat-meta">Gamemaster · ${time} ${tag}</div>${esc(msg.content)}</div>`);
  scrollChat();

  if (currentView !== 'chat') {
    document.getElementById('chat-dot').style.display = 'block';
    document.getElementById('msg-popup-text').textContent = msg.content;
    document.getElementById('msg-popup').style.display = 'flex';
  }
}

function scrollChat() {
  const box = document.getElementById('chat-messages');
  setTimeout(() => { box.scrollTop = box.scrollHeight; }, 30);
}

async function uploadFromGallery(event, missionId, mediaType) {
  const file = event.target.files?.[0];
  if(!file) return;
  currentMissionId = missionId;
  const ub   = document.getElementById(`ub-${missionId}`);
  const fill = document.getElementById(`uf-${missionId}`);
  if(ub) ub.style.display = 'block';
  const form = new FormData();
  form.append('media', file, file.name);
  const xhr = new XMLHttpRequest();
  xhr.upload.onprogress = e => { if(e.lengthComputable && fill) fill.style.width = `${(e.loaded/e.total*100).toFixed(0)}%`; };
  xhr.onload = () => {
    if(ub) ub.style.display = 'none';
    if(xhr.status === 200){
      toast(t('uploading_review')||'Hochgeladen! Wird geprüft…', 'success');
      // Repaint from server truth rather than the old dead-`mf-` footer patch.
      loadMissions();
    } else { toast(t('upload_failed')||'Upload fehlgeschlagen', 'error'); }
  };
  xhr.onerror = () => { if(ub) ub.style.display='none'; toast(t('upload_failed')||'Upload fehlgeschlagen','error'); };
  xhr.open('POST', `/api/games/${gameId}/teams/${teamId}/missions/${missionId}/upload`);
  xhr.send(form);
}

async function sendChat() {
  const input   = document.getElementById('chat-input');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';

  // Add to DOM immediately (optimistic) so player sees their own message right away
  const box = document.getElementById('chat-messages');
  const now  = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  box.insertAdjacentHTML('beforeend',
    `<div class="chat-bubble from-player"><div class="chat-meta">${t('you')||'Du'} · ${now}</div>${esc(content)}</div>`);
  scrollChat();

  await fetch(`/api/games/${gameId}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ teamId, content, fromGm: false })
  });
}

function closePopup() { document.getElementById('msg-popup').style.display = 'none'; }

// ── Rules ─────────────────────────────────────────────────────────────────────
async function loadRules() {
  const box = document.getElementById('rules-text');
  let list = [];
  // Try game-specific ruleset first (via mode)
  if (gameId) {
    try {
      list = await fetch(`/api/games/${gameId}/rules`).then(r=>r.json());
    } catch(e) {}
  }
  // Fallback to global settings
  if (!list.length) {
    try {
      const s = await fetch('/api/settings').then(r=>r.json());
      list = JSON.parse(s.rules_list || '[]');
    } catch(e) {}
  }
  if (list.length) {
    box.innerHTML = list.map((r,i) => {
      const txt = (r[lang]||r.de||r.en||'')
        .replace(/\[photo\]/gi,'📷').replace(/\[video\]/gi,'🎬').replace(/\[indoor\]/gi,'🏠');
      return `<div class="rule-entry"><strong style="color:var(--text-muted);margin-right:.4rem;">${i+1}.</strong>${esc(txt)}</div>`;
    }).join('');
  } else {
    box.innerHTML = `<p style="color:var(--text-muted);">${t('no_rules')||'Keine Regeln vorhanden.'}</p>`;
  }
}

// ── Game over ─────────────────────────────────────────────────────────────────
function showGameOver(message) {
  document.getElementById('go-title').textContent = t('go');
  const ci=document.getElementById('chat-input');
  if(ci) ci.placeholder=t('chat_ph');
  document.getElementById('go-msg').textContent   = message || '';
  document.getElementById('gameover-overlay').style.display = 'flex';
}

// ── Util ──────────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
</script>
