<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Studio</title>
<!-- Pattern AR: MindAR and the three.js it was built against, loaded on first use. -->
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
  "mindar-image":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
}}</script>
<script src="/js/dialog.js?v=1"></script>
<script src="/js/at-design.js?v=1"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:oklch(0.175 0.004 60); --bg-sunk:oklch(0.145 0.004 60);
  --surface:oklch(0.235 0.005 60); --raised:oklch(0.275 0.006 60);
  --line:oklch(0.315 0.007 60); --line-soft:oklch(0.265 0.006 60);
  --ink:oklch(0.955 0.006 85); --ink-2:oklch(0.740 0.009 75); --ink-3:oklch(0.640 0.009 75);
  --accent:oklch(0.660 0.190 42); --accent-hi:oklch(0.730 0.185 46); --accent-sunk:oklch(0.300 0.060 42);
  --go:oklch(0.830 0.180 150); --warn:oklch(0.820 0.140 85); --stop:oklch(0.660 0.190 22);
  --t-start:oklch(0.800 0.150 150); --t-station:oklch(0.790 0.140 70);
  --t-riddle:oklch(0.720 0.140 300); --t-story:oklch(0.760 0.105 220);
  --t-arg:oklch(0.740 0.160 350); --t-gate:oklch(0.830 0.130 95);
  --t-nav:oklch(0.780 0.120 195); --t-end:oklch(0.700 0.170 20);
  --display:'Big Shoulders Display','Bebas Neue',Impact,sans-serif;
  --body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --r-sm:3px; --r-md:7px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{display:block}

.app{height:100vh;display:grid;grid-template-rows:auto 1fr}
body.embed{background:transparent}
body.embed .app{height:100%}
body.embed .topbar{background:transparent;border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:18px;padding:0 15px;height:52px;background:var(--bg-sunk);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;padding-right:17px;border-right:1px solid var(--line)}
.brand b{font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand span{font:600 9px/1 var(--body);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.trailsel{display:flex;align-items:center;gap:9px;min-width:0}
.sel,.inp,.ta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;color:var(--ink);font:400 13px/1.4 var(--body)}
.inp,.ta,.sel{width:100%}
.ta{resize:vertical;min-height:70px}
.topbar .sel{width:auto;min-width:190px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kindbtn{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink-2);font:500 12px/1.2 var(--body);text-align:left;cursor:pointer}
.kindbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.kindbtn svg,.rung.find .n svg,.rung .x svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.rung.find .n{display:grid;place-items:center;color:var(--accent)}
.findform{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-sunk)}
.findform > b{display:block;font:600 12px/1.2 var(--body);margin-bottom:10px}
.findform .row2{display:flex;gap:8px;margin-top:6px}
.findform a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.arpat{display:flex;gap:11px;align-items:flex-start;margin:2px 0 14px}
.arpat img{flex:0 0 auto;width:104px;height:78px;object-fit:contain;border-radius:var(--r-sm);background:var(--surface)}
.arpat .c{flex:1;min-width:0}
.qual{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--body);color:var(--ink)}
.qual i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.qual[data-q=good] i{background:var(--go)}.qual[data-q=ok] i{background:var(--warn)}.qual[data-q=poor] i{background:var(--stop)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;min-width:0;accent-color:var(--accent)}
.range output{flex:0 0 52px;text-align:right;font:600 11px/1 var(--mono);color:var(--ink-2)}
.arprev{position:relative;height:236px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);margin:2px 0 8px;cursor:grab;
  background:radial-gradient(120% 90% at 50% 15%,var(--raised),var(--bg-sunk))}
.arprev:active{cursor:grabbing}
.arprev .ph{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;color:var(--ink-3);font:500 11px/1.45 var(--body)}
.prog{height:6px;border-radius:999px;background:var(--surface);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}
.arcam{position:fixed;inset:0;z-index:85;background:oklch(0.10 0.004 60 / .84);display:grid;place-items:center;padding:24px}
.arcam .in{width:min(760px,100%);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.arcam .stagebox{position:relative;aspect-ratio:4/3;max-height:calc(100vh - 140px);background:var(--bg-sunk);overflow:hidden;isolation:isolate}
.arcam .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px}
.arcam .st{font:500 12px/1.45 var(--body);color:var(--ink-2)}
.pageprev{position:fixed;inset:0;z-index:80;background:oklch(0.10 0.004 60 / .78);display:grid;place-items:center;padding:24px}
.pageprev .pp-in{width:min(430px,100%);height:min(860px,100%);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pageprev .pp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;font:500 12px/1.2 var(--body);color:var(--ink-2)}
.pageprev iframe{flex:1;border:0;background:#fff;width:100%}
.pageprev .pp-3d{flex:1;display:grid;place-items:center;min-height:0}
.dthumb{position:relative;height:320px;border-radius:12px;overflow:hidden;background:#0B0F1A;border:1px solid var(--line);margin-bottom:12px}
.dthumb[data-empty] span{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-3);font:500 12px/1.5 var(--body)}
.seg{display:flex;background:var(--surface);border-radius:var(--r-md);padding:3px;gap:2px;margin-left:auto}
.seg button{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:var(--r-sm);color:var(--ink-3)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--body);padding:7px 11px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.chip.warn{color:var(--warn);background:oklch(0.270 0.045 85)}
.chip.bad{color:var(--stop);background:oklch(0.265 0.055 22)}
.chip.ok{color:var(--go);background:oklch(0.260 0.050 150)}
.btn{font:700 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;padding:9px 13px;border-radius:var(--r-md);background:var(--raised)}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--accent);color:oklch(0.99 0 0)}
.btn.primary:hover{background:var(--accent-hi)}
.btn.sm{padding:7px 10px;font-size:11px}

.body{display:grid;grid-template-columns:52px 1fr 372px;min-height:0}
.rail{background:var(--bg-sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;overflow:hidden}
.rail button{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-3);position:relative}
/* Unfolded, the rail names every part instead of relying on hover. */
.body.railopen{grid-template-columns:188px 1fr 372px}
.railopen .rail{align-items:stretch;padding:10px 9px}
.railopen .rail button{width:100%;height:auto;grid-template-columns:20px 1fr;display:grid;
  align-items:center;gap:10px;padding:9px 8px;justify-items:start}
.railopen .rail button::after{display:none}
.railopen .rail button .nm{display:block;font:600 12px/1 var(--body);white-space:nowrap}
.rail button .nm{display:none}
.railopen .rail hr{width:auto}
.rail .fold{color:var(--ink-3)}
.railopen .rail .fold svg{transform:rotate(180deg)}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rail button::after{content:attr(data-name);position:absolute;left:46px;white-space:nowrap;background:var(--raised);
  border:1px solid var(--line);font:600 11px/1 var(--body);padding:6px 9px;border-radius:var(--r-sm);opacity:0;pointer-events:none;z-index:50;color:var(--ink)}
.rail button:hover::after{opacity:1}
.rail hr{width:20px;border:0;border-top:1px solid var(--line);margin:6px 0}

.stage{display:grid;grid-template-columns:1fr 1fr;min-width:0;min-height:0}
/* Each pane keeps its own column. Hidden with display:none, the flow pane used
   to hand its column to the map, which then sat in the zero-width one: black. */
#pane-flow{grid-column:1}
#pane-map{grid-column:2}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane + .pane{border-left:1px solid var(--line)}
.pane-head{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.pane-head h2{font:700 10px/1 var(--body);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
.pane-head .sp{margin-left:auto}
.mini{font:600 11px/1 var(--body);color:var(--ink-3);padding:5px 8px;border-radius:var(--r-sm)}
.mini:hover{color:var(--ink);background:var(--surface)}

/* Slim, dark scrollbars: the flow is panned by dragging, so they only need to
   say there is more, not be grabbed. */
.canvas{flex:1;position:relative;overflow:auto;cursor:grab;background-color:var(--bg-sunk);
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  background-image:radial-gradient(circle at 1px 1px, oklch(0.300 0.006 60) 1px, transparent 0);background-size:22px 22px}
.sheet{position:relative;width:1400px;height:1600px}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.edges path{fill:none;stroke:var(--line);stroke-width:1.6}
.edges path.br{stroke:var(--t-gate);stroke-dasharray:4 4}

.node{position:absolute;width:184px;z-index:2;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);cursor:grab;user-select:none}
/* Connection handles, the way EscapeFlow does it: drag out of one node and
   drop on another. A generous invisible ring around a small visible dot, so
   it can be hit with a trackpad without making the card look studded. */
.node .hdl{position:absolute;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;
  background:var(--raised);border:2px solid var(--line);z-index:4;cursor:crosshair;
  transition:background .14s var(--ease),border-color .14s var(--ease),transform .14s var(--ease)}
.node .hdl::after{content:'';position:absolute;top:-9px;left:-9px;right:-9px;bottom:-9px;border-radius:50%}
.node .hdl-bot{bottom:-7px} .node .hdl-top{top:-7px}
.node:hover .hdl,.node.is-sel .hdl{border-color:var(--accent)}
.node .hdl:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.node.droptarget{border-color:var(--go);box-shadow:0 0 0 2px var(--go)}
.edges path.hit{stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.edges path.sel{stroke:var(--accent);stroke-width:2.4}
.canvas.dropping{outline:2px dashed var(--accent);outline-offset:-6px}
.edges path.ghost{stroke:var(--go);stroke-width:2;stroke-dasharray:5 4}
.edge-x{position:absolute;z-index:5;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  background:var(--stop);color:oklch(0.99 0 0);display:grid;place-items:center;font:700 12px/1 var(--body);
  border:2px solid var(--bg-sunk)}
.node.is-sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.node.linking{border-color:var(--go);box-shadow:0 0 0 1px var(--go)}
.node .cap{height:3px;border-radius:var(--r-md) var(--r-md) 0 0}
.node .in{padding:9px 11px 10px}
.node .kind{display:flex;align-items:center;gap:6px;font:700 9px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.node .kind i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
.node h3{font:600 13px/1.3 var(--body);color:var(--ink);margin-bottom:5px;word-break:break-word}
.node .meta{display:flex;gap:5px;flex-wrap:wrap}
.tag{font:600 9px/1 var(--mono);padding:3px 6px;border-radius:var(--r-sm);background:var(--bg-sunk);color:var(--ink-3)}
.tag.gps{color:var(--t-station)} .tag.ok{color:var(--go)} .tag.bad{color:var(--warn)}
.k-start{color:var(--t-start)} .k-start .cap{background:var(--t-start)}
.k-station{color:var(--t-station)} .k-station .cap{background:var(--t-station)}
.k-riddle{color:var(--t-riddle)} .k-riddle .cap{background:var(--t-riddle)}
.k-story{color:var(--t-story)} .k-story .cap{background:var(--t-story)}
.k-arg{color:var(--t-arg)} .k-arg .cap{background:var(--t-arg)}
.k-gate{color:var(--t-gate)} .k-gate .cap{background:var(--t-gate)}
.k-nav{color:var(--t-nav)} .k-nav .cap{background:var(--t-nav)}
.k-end{color:var(--t-end)} .k-end .cap{background:var(--t-end)}

/* Leaflet's panes sit at z-index 400 and up; contained here, they stay under the studio's overlays. */
#map{flex:1;background:oklch(0.205 0.006 230);isolation:isolate}
.leaflet-container{background:oklch(0.205 0.006 230)}
.at-pin{background:none;border:none}
.at-pin b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  font:800 10px/1 var(--mono);color:oklch(0.17 0.004 60);box-shadow:0 2px 7px oklch(0.14 0 0 / .8)}

.inspector{background:var(--bg-sunk);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.insp-head{padding:13px 14px 0}
.insp-kind{display:flex;align-items:center;gap:7px;font:700 9px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.insp-kind i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
.insp-head h2{font:700 16px/1.25 var(--body);margin-bottom:3px;word-break:break-word}
.insp-head .sub{font:400 11px/1.4 var(--body);color:var(--ink-3)}
.tabs{display:flex;gap:1px;padding:12px 14px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:600 11px/1 var(--body);padding:8px 9px;white-space:nowrap;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{flex:1;overflow-y:auto;padding:15px 14px 22px}
.panel[hidden]{display:none}
.fld{margin-bottom:14px}
.fld > label{display:block;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.hint{font:400 11px/1.45 var(--body);color:var(--ink-3);margin-top:6px;max-width:62ch}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.sw{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--line-soft)}
.sw .txt{flex:1}.sw .txt b{display:block;font:600 13px/1.3 var(--body);margin-bottom:2px}
.sw .txt span{font:400 11px/1.4 var(--body);color:var(--ink-3)}
.tog{flex:0 0 auto;width:36px;height:21px;border-radius:999px;background:var(--line);position:relative;margin-top:2px;cursor:pointer}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--ink-2);transition:transform .2s var(--ease)}
.tog.on{background:var(--accent)}.tog.on::after{transform:translateX(15px);background:oklch(0.98 0 0)}
.rung{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);align-items:flex-start}
.rung .n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--accent-sunk);color:var(--accent-hi);display:grid;place-items:center;font:700 10px/1 var(--mono)}
.rung .c{flex:1;min-width:0}
.rung .c .row{display:flex;gap:6px;margin-top:6px;align-items:center}
.rung .c .row input[type=number]{width:72px}
.rung .x{flex:0 0 auto;color:var(--ink-3);padding:3px 6px}
.drop{margin-top:10px;border:1px dashed var(--line);border-radius:var(--r-md);padding:14px;text-align:center;color:var(--ink-3);font:500 11px/1.4 var(--body);cursor:pointer}
.foot{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.foot .btn{flex:1;text-align:center}
.issues{display:flex;flex-direction:column}
.issue{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line-soft);font:400 12px/1.45 var(--body);color:var(--ink-2);cursor:pointer}
.issue:first-child{border-top:0}
.issue i{flex:0 0 auto;width:6px;height:6px;border-radius:50%;margin-top:6px;font-style:normal}
.issue.error i{background:var(--stop)} .issue.warn i{background:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.codes{font:600 13px/1.9 var(--mono);color:var(--ink-2);word-break:break-all}
/* One floating tooltip, driven by data-tip. Explains every control rather than
   relying on the reader already knowing the vocabulary. */
#tip{position:fixed;z-index:9999;max-width:290px;pointer-events:none;opacity:0;
  background:var(--raised);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font:400 12px/1.5 var(--body);
  box-shadow:0 10px 30px oklch(0.12 0 0 / .65);transition:opacity .13s var(--ease)}
#tip.on{opacity:1}
#tip b{display:block;font:700 11px/1.3 var(--body);color:var(--accent-hi);margin-bottom:4px}
.tipdot{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;
  border:1px solid var(--line);color:var(--ink-3);font:700 9px/1 var(--body);
  margin-left:6px;cursor:help;vertical-align:1px}
.tipdot:hover{border-color:var(--accent);color:var(--accent-hi)}
.modal{position:fixed;inset:0;z-index:90;background:oklch(0.12 0 0 / .78);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .in{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px}
.modal h3{font:800 18px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin-bottom:13px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>Trail Studio</b><span>AdventureTrail</span></div>
    <div class="trailsel">
      <select class="sel" id="trail-pick" data-tip="trail"></select>
      <button class="btn sm" id="b-new-trail">+ Trail</button>
    </div>
    <div class="seg">
      <button type="button" data-view="flow" data-tip="v-flow">Fluss</button>
      <button type="button" data-view="split" data-tip="v-split" aria-pressed="true">Geteilt</button>
      <button type="button" data-view="map" data-tip="v-map">Karte</button>
    </div>
    <span class="chip" id="check-chip" data-tip="check">Prüfung</span>

// Hover or keyboard focus shows it; nothing is required but the attribute.
(function(){
  let el;
  const box = () => el || (el = document.getElementById('tip'));
  function show(t, target){
    const e = box(); if(!e || !t) return;
    e.innerHTML = '<b></b><span></span>';
    e.querySelector('b').textContent = t[0];
    e.querySelector('span').textContent = t[1];
    e.classList.add('on');
    const r = target.getBoundingClientRect();
    e.style.left = '0px'; e.style.top = '0px';
    const w = e.offsetWidth, h = e.offsetHeight;
    let x = Math.min(window.innerWidth - w - 10, Math.max(10, r.left));
    let y = r.bottom + 8;
    if(y + h > window.innerHeight - 10) y = Math.max(10, r.top - h - 8);
    e.style.left = x + 'px'; e.style.top = y + 'px';
  }
  // A tip waits a moment before it appears and never shows while a button is
  // held: dragging a connection or panning the canvas is exactly when one
  // popping up is in the way. Keyboard focus still shows it at once.
  // After a click the control is known, and its tip would only cover what
  // the click just opened, so tips stay quiet until the pointer leaves that spot.
  let wait = 0, held = false, shownFor = null, quiet = null;
  const inQuiet = e => quiet && e.clientX >= quiet.left && e.clientX <= quiet.right
                             && e.clientY >= quiet.top && e.clientY <= quiet.bottom;
  function hide(){ clearTimeout(wait); shownFor = null; const e = box(); if(e) e.classList.remove('on'); }
  const find = n => { const t = n && n.closest && n.closest('[data-tip]'); return t ? [t, TIPS[t.dataset.tip]] : null; };
  document.addEventListener('mouseover', e => {
    if(held && e.buttons === 0) held = false;    // released outside this frame
    const f = find(e.target);
    if(!f || !f[1] || held || f[0] === shownFor || inQuiet(e)) return;
    clearTimeout(wait);
    // A re-render inside the pause replaces the control; a tip for the old,
    // detached one would land in the corner of the screen.
    wait = setTimeout(() => { if(!held && f[0].isConnected){ show(f[1], f[0]); shownFor = f[0]; } }, 400);
  });
  document.addEventListener('mouseout', e => {
    const from = find(e.target); if(!from) return;
    const to = find(e.relatedTarget);
    if(to && to[0] === from[0]) return;          // still inside the same control
    hide();
  });
  document.addEventListener('pointerdown', e => {
    held = true; hide();
    const t = e.target && e.target.closest && e.target.closest('[data-tip]');
    quiet = t ? t.getBoundingClientRect() : null;
  }, true);
  document.addEventListener('mousemove', e => { if(quiet && !inQuiet(e)) quiet = null; }, true);
  document.addEventListener('pointerup', () => { held = false; }, true);
  document.addEventListener('pointercancel', () => { held = false; }, true);
  document.addEventListener('focusin', e => {
    if(held) return;
    const f = find(e.target); if(f && f[1]){ show(f[1], f[0]); shownFor = f[0]; }
  });
  document.addEventListener('focusout',  hide);
  window.addEventListener('scroll', hide, true);
})();
// A small ⓘ next to a label, for things a hover over the label alone would miss.
const tipdot = key => '<span class="tipdot" data-tip="' + key + '" tabindex="0">i</span>';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Studio calls are GM-gated. The token is the one the settings gate issues.
let TOKEN = sessionStorage.getItem('gm_token') || '';
async function api(method, url, body){
  const h = { 'Content-Type':'application/json' };
  if(TOKEN) h.Authorization = 'Bearer ' + TOKEN;
  const r = await fetch('/api/at' + url, { method, headers:h, body: method==='GET'?undefined:JSON.stringify(body||{}) });
  if(r.status === 401){ await gate(); return api(method, url, body); }
  return r.json().catch(()=>({}));
}
async function gate(){
  const pw = await uiPrompt('GM-Passwort', { title:'Gesperrt' });
  if(!pw) throw new Error('no auth');
  const r = await fetch('/api/settings/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
  const j = await r.json();
  if(!j.valid) { await uiAlert('Falsches Passwort.'); return gate(); }
  TOKEN = j.token; sessionStorage.setItem('gm_token', TOKEN);
}

let TRAIL = null, NODES = [], EDGES = [], selId = null, selEdge = null, map = null, markers = {};
// Where a Peilung points: the first connected node downstream that has a
// location. The server resolves it the same way, so the studio shows the truth.
function navTargetOf(node){
  const seen = new Set([node.id]);
  let frontier = [node.id];
  for(let d = 0; d < 12 && frontier.length; d++){
    const next = [];
    for(const id of frontier){
      for(const e of EDGES){
        if(e.from_node !== id || seen.has(e.to_node)) continue;
        seen.add(e.to_node);
        const t = NODES.find(n => n.id === e.to_node);
        if(t && t.lat != null && t.lng != null) return t;
        next.push(e.to_node);
      }
    }
    frontier = next;
  }
  return null;
}
const KIND = { start:'Start', station:'Station', riddle:'Rätsel', story:'Story', arg:'ARG-Fund', gate:'Weiche', nav:'Peilung', end:'Ende' };
const L1 = () => (TRAIL && TRAIL.langs && TRAIL.langs[0]) || 'de';
const tx = (o, l) => (o && (o[l || L1()] || o.de || Object.values(o).find(v=>v))) || '';

// ── Load ─────────────────────────────────────────────────────────────────────
async function loadTrails(){
  const list = await api('GET', '/trails');
  const pick = $('#trail-pick');
  pick.innerHTML = list.map(t => '<option value="'+t.id+'">'+esc(t.name)+(t.city?' · '+esc(t.city):'')+'</option>').join('')
    || '<option value="">Noch kein Trail</option>';
  const q = new URLSearchParams(location.search);
  const want = [q.get('trail'), localStorage.getItem('at_trail')].find(t => t && list.some(x => String(x.id) === String(t)));
  if(list.length){
    pick.value = want || list[0].id; await openTrail(pick.value);
    // Coming back from the page designer: the part that was being designed.
    const nid = Number(q.get('node'));
    if(nid && NODES.some(x => x.id === nid)){ selId = nid; if(q.get('tab')) tab = q.get('tab'); render(); }
  }
}
let _recentre = false;
async function openTrail(id){
  if(!id) return;
  _recentre = true;   // a different trail means a different city
  localStorage.setItem('at_trail', id);
  const d = await api('GET', '/trails/' + id);
  TRAIL = d.trail; NODES = d.nodes || []; EDGES = d.edges || [];
  if(!NODES.some(n => n.id === selId)) selId = null;
  render(); runCheck();
}
$('#trail-pick').addEventListener('change', e => openTrail(e.target.value));
// In-app, not a browser prompt: a prompt() cannot be styled, cannot hold two
// fields, and on some phones does not appear at all.
function dialog(title, fieldsHtml, onOk, okLabel){
  $('#modal-in').innerHTML = '<h3>'+esc(title)+'</h3>' + fieldsHtml
    + '<div style="display:flex;gap:8px;margin-top:15px">'
    + '<button class="btn" id="dlg-cancel" style="flex:1">Abbrechen</button>'
    + '<button class="btn primary" id="dlg-ok" style="flex:1">'+esc(okLabel||'Übernehmen')+'</button></div>';
  $('#modal').classList.add('on');
  const close = () => $('#modal').classList.remove('on');
  $('#dlg-cancel').onclick = close;
  $('#dlg-ok').onclick = async () => { const keep = await onOk(); if(keep !== false) close(); };
  const first = $('#modal-in input'); if(first){ first.focus(); first.select(); }
  $('#modal-in').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); $('#dlg-ok').click(); } };
}
$('#b-new-trail').addEventListener('click', () => {
  dialog('Neuer Trail',
    '<div class="fld"><label>Name</label><input class="inp" id="d-name" placeholder="Die letzte Schicht"></div>'
    + '<div class="fld"><label>Stadt</label><input class="inp" id="d-city" list="d-cities" placeholder="Basel">'
    + '<datalist id="d-cities">' + Object.keys(CITIES).map(c => '<option value="'+c+'">').join('') + '</datalist>'
    + '<p class="hint">Setzt die Karte an den richtigen Ort.</p></div>',
    async () => {
      const name = $('#d-name').value.trim(); if(!name) return false;
      const city = $('#d-city').value.trim();
      const r = await api('POST', '/trails', { name, city });
      await loadTrails(); $('#trail-pick').value = r.id; await openTrail(r.id);
    }, 'Anlegen');
});

// ── Canvas ───────────────────────────────────────────────────────────────────
function render(){
  const sheet = $('#sheet');
  [...sheet.querySelectorAll('.node')].forEach(n => n.remove());
  NODES.forEach(n => sheet.appendChild(nodeEl(n)));
  $('#node-count').textContent = NODES.length + ' Bausteine';
  $('#geo-count').textContent = NODES.filter(n=>n.lat!=null).length + ' Orte';
  drawEdges(); renderMap(); renderInspector();
}
function nodeEl(n){
  const d = document.createElement('div');
  d.className = 'node k-' + n.kind + (n.id===selId?' is-sel':'');
  d.dataset.id = n.id;
  d.style.left = (n.x||0) + 'px'; d.style.top = (n.y||0) + 'px';
  const tags = [];
  if(n.trigger_kind === 'gps') tags.push('<span class="tag gps">GPS '+(n.radius_m||45)+' m</span>');
  if(n.trigger_kind === 'answer') tags.push('<span class="tag">Antwort</span>');
  if(n.nav_mode && n.nav_mode !== 'none') tags.push('<span class="tag">'+esc(n.nav_mode)+'</span>');
  if(n.post_code) tags.push('<span class="tag ok">Code</span>');
  if((n.hints||[]).length) tags.push('<span class="tag">'+n.hints.length+' Hinweise</span>');
  if(n.trigger_kind === 'gps' && n.lat == null) tags.push('<span class="tag bad">Ort fehlt</span>');
  if(n.trigger_kind === 'ar') tags.push((n.assets||[]).some(a => a.kind === 'ar') ? '<span class="tag">AR-Muster</span>' : '<span class="tag bad">Muster fehlt</span>');
  if(n.kind === 'nav'){

function drawEdges(){
  const sheet = $('#sheet'), svg = $('#edges');
  svg.setAttribute('viewBox', '0 0 ' + sheet.offsetWidth + ' ' + sheet.offsetHeight);
  const box = id => { const e = sheet.querySelector('[data-id="'+id+'"]');
    return e ? { x:e.offsetLeft, y:e.offsetTop, w:e.offsetWidth, h:e.offsetHeight } : null; };
  const paths = [];
  const mids = [];
  EDGES.forEach(ed => {
    const a = box(ed.from_node), b = box(ed.to_node);
    if(!a || !b) return;
    const gapR = b.x-(a.x+a.w), gapL = a.x-(b.x+b.w), below = b.y > a.y+a.h-2;
    let d;
    if(below && gapR < 24 && gapL < 24){
      const sx=a.x+a.w/2, sy=a.y+a.h, tx2=b.x+b.w/2, ty=b.y;
      const c = Math.max(6, Math.min(52,(ty-sy)/2));
      d = 'M'+sx+','+sy+' C'+sx+','+(sy+c)+' '+tx2+','+(ty-c)+' '+tx2+','+ty;
    } else {
      const right = b.x > a.x;
      const sx=right?a.x+a.w:a.x, sy=a.y+a.h/2, tx2=right?b.x:b.x+b.w, ty=b.y+b.h/2;
      const c = Math.min(64, Math.abs(tx2-sx)/2+18) * (right?1:-1);
      d = 'M'+sx+','+sy+' C'+(sx+c)+','+sy+' '+(tx2-c)+','+ty+' '+tx2+','+ty;
    }
    const on = selEdge && selEdge.from === ed.from_node && selEdge.to === ed.to_node;
    paths.push('<path class="hit" data-from="'+ed.from_node+'" data-to="'+ed.to_node+'" d="'+d+'"/>');
    paths.push('<path d="'+d+'" class="'+(ed.branch_key?'br ':'')+(on?'sel':'')+'"/>');
    if(on) mids.push({ from:ed.from_node, to:ed.to_node, d });
  });
  // The live connection being dragged out of a handle.
  if(link){
    const a = box(link.from);
    if(a){
      const sx = a.x + a.w/2, sy = link.dir === 'out' ? a.y + a.h : a.y;
      paths.push('<path class="ghost" d="M'+sx+','+sy+' L'+link.pt.x+','+link.pt.y+'"/>');
    }
  }
  svg.innerHTML = paths.join('');

  [...sheet.querySelectorAll('.edge-x')].forEach(e => e.remove());
  svg.querySelectorAll('.hit').forEach(h => h.addEventListener('pointerdown', ev => {
    ev.stopPropagation();
    selEdge = { from:Number(h.dataset.from), to:Number(h.dataset.to) };
    selId = null; renderInspector(); drawEdges();
  }));
  mids.forEach(m => {
    const tmp = svg.querySelector('.hit[data-from="'+m.from+'"][data-to="'+m.to+'"]');
    if(!tmp) return;
    const pt = tmp.getPointAtLength(tmp.getTotalLength() / 2);
    const x = document.createElement('button');
    x.className = 'edge-x'; x.textContent = '\u00d7';
    x.style.left = pt.x + 'px'; x.style.top = pt.y + 'px';
    x.title = 'Verbindung löschen';
    x.onclick = async ev => { ev.stopPropagation();
      await api('DELETE', '/trails/' + TRAIL.id + '/edges', { from:m.from, to:m.to });
      selEdge = null; await openTrail(TRAIL.id); };
    sheet.appendChild(x);
  });
}

const canvasPt = e => {

$('#sheet').addEventListener('pointerdown', e => {

  }

$('#sheet').addEventListener('pointermove', e => {

    document.querySelectorAll('.node.droptarget').forEach(x => x.classList.remove('droptarget'));
    if(t && Number(t.dataset.id) !== link.from) t.classList.add('droptarget');

  if(!drag) return;
  drag.moved = true;

$('#sheet').addEventListener('pointerup', async e => {
  try { $('#sheet').releasePointerCapture(e.pointerId); } catch(err) {}

    const from = link.from, dir = link.dir;
    link = null;
    document.querySelectorAll('.node.droptarget').forEach(x => x.classList.remove('droptarget'));
    const over = document.elementFromPoint(e.clientX, e.clientY);

    return toggleEdge(a, b);

$('#b-tidy').addEventListener('click', async () => {
  // Lay the graph out by walking it from its roots, so the spine reads downward.
  const seen = new Set(), cols = [];
  const roots = NODES.filter(n => !EDGES.some(e => e.to_node === n.id));
  let layer = roots.length ? roots : NODES.slice(0,1);
  while(layer.length){
    cols.push(layer);
    layer.forEach(n => seen.add(n.id));
    const next = [];
    layer.forEach(n => EDGES.filter(e => e.from_node === n.id).forEach(e => {
      if(seen.has(e.to_node)) return;
      const t = NODES.find(x => x.id === e.to_node);
      if(t && !next.includes(t)){ next.push(t); seen.add(t.id); }
    }));
    layer = next;
  }
  NODES.filter(n => !seen.has(n.id)).forEach(n => cols.push([n]));
  for(let r = 0; r < cols.length; r++){
    for(let c = 0; c < cols[r].length; c++){
      const n = cols[r][c];
      n.x = 40 + c * 206; n.y = 30 + r * 158;
      await api('PUT', '/nodes/' + n.id, { x:n.x, y:n.y });
    }
  }
  render();
});

function renderMap(){
  if(!map){
    map = L.map('map', { zoomControl:true }).setView([47.5596, 7.5886], 15);
    L.tileLayer(MAP_TILE_URL, { maxZoom:19, attribution:MAP_TILE_ATTRIB }).addTo(map);

  }
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  const geo = NODES.filter(n => n.lat != null && n.lng != null);
  geo.forEach((n, i) => {
    const colour = getComputedStyle(document.documentElement).getPropertyValue('--t-' + n.kind).trim() || '#E85F1E';
    const m = L.marker([n.lat, n.lng], { draggable:true, icon: L.divIcon({
      className:'at-pin', iconSize:[20,20],
      html:'<b style="background:'+colour+'">'+(i+1)+'</b>' }) }).addTo(map);

      await api('PUT', '/nodes/' + n.id, { lat:n.lat, lng:n.lng });

  setTimeout(()=>map.invalidateSize(), 60);
}

        const f = e.target.files[0]; if(!f) return;
        const err = $('#ff-err'); if(err) err.textContent = '';
        busy(true, 'Muster wird eingelernt … 0 %', 0);
        let res;
        try { res = await (await arModule()).compilePattern(f, p => busy(true, 'Muster wird eingelernt … ' + p + ' %', p)); }
        catch(e2){
          busy(false);
          if(err) err.textContent = e2 && e2.code === 'bad_image' ? 'Dieses Bild lässt sich nicht öffnen.'
            : e2 && e2.code === 'offline' ? 'Zum Einlernen braucht es eine Internetverbindung.'
            : e2 && e2.code === 'unsupported' ? 'Dieser Browser kann keine Muster einlernen. Chrome, Edge, Firefox oder Safari in einer aktuellen Version nehmen.'
            : 'Das Einlernen hat nicht geklappt. Ein anderes Bild versuchen.';
          return;
        }
        busy(false);
        if(!res.points){ if(err) err.textContent = 'Auf diesem Bild findet die Kamera nichts zum Festhalten. Ein Bild mit mehr Details und Kontrasten wählen.'; return; }
        if(res.quality === 'poor' && !await uiConfirm('Dieses Muster hat wenig Details. Die Kamera erkennt es schwer und verliert es leicht. Trotzdem verwenden?', { ok:'Trotzdem verwenden' })) return;
        const fd = new FormData();
        fd.append('pw', res.width); fd.append('ph', res.height); fd.append('points', res.points); fd.append('quality', res.quality);
        fd.append('image', res.image, 'muster.jpg'); fd.append('mind', new Blob([res.mind]), 'muster.mind');
        busy(true, 'Wird hochgeladen …');
        await done(fd);
        busy(false);
      };
      inp.click();
    };
    const arForm = cur => {
      const ff = $('#find-form');
      const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
      const tail = '<div id="ff-prog" hidden><div class="prog"><i></i></div><p class="hint" id="ff-prog-t" role="status"></p></div>'
        + '<div id="ff-err" class="hint" style="color:var(--stop)" role="alert"></div></div>';
      if(!cur){
        ff.innerHTML = '<div class="findform"><b>AR-Muster</b>'
          + field('Titel, so sieht das Team den Fund','ff-title','')
          + '<p class="hint" style="margin:-6px 0 12px">Ein Bild, das die Kamera am Posten wiedererkennt: ein gedrucktes Kärtchen, ein Plakat, eine Tafel. Viele Details und harte Kontraste helfen; ein schlichtes Logo oder ein paar Worte reichen nicht.</p>'
          + '<div class="fld"><label>Oder zum Ausprobieren'+tipdot('sample-pattern')+'</label>'
          + '<button class="btn" type="button" id="ff-arsample" style="width:100%">Testmuster: Schatzkarte</button></div>'
          + '<div class="row2"><button class="btn primary" type="button" id="ff-file">Musterbild wählen</button>'
          + '<button class="btn" type="button" id="ff-cancel">Abbrechen</button></div>' + tail;
        $('#ff-cancel').onclick = () => { ff.innerHTML = ''; };
        $('#ff-arsample').onclick = async () => {
          const r = await api('POST', '/nodes/' + n.id + '/assets/ar-sample', {});
          if(!r || !r.success){ $('#ff-err').textContent = FIND_ERR[r && r.error] || 'Das hat nicht geklappt.'; return; }
          reopenFind = r.id; await openTrail(TRAIL.id);
        };
        $('#ff-file').onclick = () => pickPattern(async fd => {
          fd.append('title', val('ff-title') || 'AR-Muster');
          const r = await sendForm('/api/at/nodes/' + n.id + '/assets/ar', fd);
          if(r.success){ reopenFind = r.id; await openTrail(TRAIL.id); }
        });
        ff.scrollIntoView({ block:'nearest' });
        return;
      }
      const m = cur.meta || {}, q = AR_QUAL[m.quality] ? m.quality : 'ok';
      const S = { place: arPlaceOf(m), scale: m.scale != null ? Number(m.scale) : 1, rot: Number(m.rot) || 0, hint: m.hint !== false };
      const placeHint = v => AR_PLACE.find(p => p[0] === v)[2];
      ff.innerHTML = '<div class="findform"><b>Bearbeiten: AR-Muster</b>'
        + field('Titel, so sieht das Team den Fund','ff-title',cur.title)
        + '<div class="arpat"><img id="ff-thumb" alt="Das Muster"><div class="c">'
        +   '<span class="qual" data-q="'+q+'"><i></i>'+esc(AR_QUAL[q])+tipdot('ar-quality')+'</span>'
        +   (m.points ? '<p class="hint" style="margin-top:4px">'+m.points+' Anhaltspunkte für die Kamera</p>' : '')
        +   '</div></div>'
        + '<div class="row2" style="margin:-4px 0 14px"><button class="btn sm" type="button" id="ff-repl" style="flex:1">Muster ersetzen</button>'
        +   '<a class="btn sm" id="ff-dl" style="flex:1;justify-content:center" download="'+esc(fileName(cur.title))+'.jpg">Herunterladen</a></div>'
        + '<div class="fld"><label>Was erscheint'+tipdot('ar-show')+'</label>'
        +   '<p class="hint" style="margin:0 0 8px">'+(m.src ? esc(AR_SHOW_LABEL[m.show] || '') + (m.src_name ? ': ' + esc(m.src_name) : '')
               : 'Nichts. Ein goldener Rahmen zeigt dem Team, dass die Kamera das Muster gefunden hat.')+'</p>'
        +   '<div class="row2" style="margin-top:0"><button class="btn" type="button" id="ff-content" style="flex:1">'+(m.src ? 'Anderen Inhalt wählen' : '3D-Objekt, Bild oder Video')+'</button>'
        +   (m.src ? '<button class="btn" type="button" id="ff-content-del">Entfernen</button>' : '') + '</div>'
        +   '<div class="row2" style="align-items:center"><span class="hint" style="margin:0">Beispiel:</span>'
        +   '<button class="btn sm" type="button" data-arc="chest" style="flex:1">Schatztruhe</button>'
        +   '<button class="btn sm" type="button" data-arc="key" style="flex:1">Schlüssel</button></div></div>'
        + '<div class="fld"><label>Lage'+tipdot('ar-place')+'</label><div class="seg" style="margin-left:0">'
        +   AR_PLACE.map(([v, t]) => '<button type="button" data-arplace="'+v+'" aria-pressed="'+(S.place === v)+'">'+t+'</button>').join('')
        +   '</div><p class="hint" id="ff-place-h">'+esc(placeHint(S.place))+'</p></div>'
        + '<div class="fld"><label for="ff-scale">Grösse</label><div class="range"><input type="range" id="ff-scale" min="0.1" max="5" step="0.05" value="'+S.scale+'"><output id="ff-scale-o" for="ff-scale"></output></div>'
        +   '<p class="hint">Die längste Seite des Inhalts, gemessen an der Breite des Musters.</p></div>'
        + '<div class="fld"><label for="ff-rot">Drehung</label><div class="range"><input type="range" id="ff-rot" min="-180" max="180" step="5" value="'+S.rot+'"><output id="ff-rot-o" for="ff-rot"></output></div></div>'
        + '<div class="arprev" id="ff-prev" role="img" aria-label="Vorschau des Musters mit Inhalt" title="Mit der Maus drehen, mit dem Rad zoomen"><span class="ph">Vorschau lädt …</span></div>'
        + '<button class="btn" type="button" id="ff-cam" style="width:100%">Mit Kamera testen</button>'
        + '<div class="sw" style="margin-top:12px"><span class="txt"><b>Muster im Spieler zeigen</b><span>Hilft beim Suchen. Aus, wenn das Muster selbst gefunden werden soll.</span></span>'
        +   '<button type="button" class="tog'+(S.hint ? ' on' : '')+'" id="ff-hint" role="switch" aria-checked="'+S.hint+'" aria-label="Muster im Spieler zeigen"></button></div>'
        + '<div class="row2"><button class="btn primary" type="button" id="ff-save">Speichern</button>'
        +   '<button class="btn" type="button" id="ff-cancel">Abbrechen</button></div>' + tail;
      const out = () => {
        $('#ff-scale-o').textContent = S.scale.toFixed(2).replace(/0$/, '') + ' ×';
        $('#ff-rot-o').textContent = S.rot + '°';
      };
      out();
      let prev = null, tmr = 0;
      const cfg = () => ({ show: m.src ? m.show : 'none', place: S.place, scale: S.scale, rot: S.rot, aspect: arAspect(m) });
      const refresh = () => { clearTimeout(tmr); tmr = setTimeout(() => { if(prev) prev.update(cfg()).catch(() => {}); }, 80); };
      const payload = () => ({ title: val('ff-title'), meta: { place: S.place, scale: S.scale, rot: S.rot, hint: S.hint } });
      // Whatever is changed on the spot keeps what was set but not yet saved.
      const keepEdits = () => api('PUT', '/assets/' + cur.id, payload());
      const reopen = async () => { reopenFind = cur.id; await openTrail(TRAIL.id); };
      authBlob(arFile(cur, cur.path)).then(async u => {
        const im = $('#ff-thumb'); if(!im) return;
        im.src = u; $('#ff-dl').href = u;
        try {
          const src = m.src ? await authBlob(arFile(cur, m.src)) : '';
          const A = await arModule();
          const box = $('#ff-prev'); if(!box) return;
          prev = await A.previewAR(box, Object.assign(cfg(), { pattern: u, src }));
        } catch(e){
          const box = $('#ff-prev');
          if(box) box.innerHTML = '<span class="ph">' + (e && e.code === 'offline' ? 'Die Vorschau braucht eine Internetverbindung.'
            : e && e.code === 'unsupported' ? 'Dieser Browser kann die Vorschau nicht zeigen.' : 'Die Vorschau konnte nicht geladen werden.') + '</span>';
        }
      }).catch(() => { const box = $('#ff-prev'); if(box) box.innerHTML = '<span class="ph">Das Muster konnte nicht geladen werden.</span>'; });
      ff.querySelectorAll('[data-arplace]').forEach(b => b.onclick = () => {
        S.place = b.dataset.arplace;
        ff.querySelectorAll('[data-arplace]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        $('#ff-place-h').textContent = placeHint(S.place);
        refresh();
      });
      $('#ff-scale').oninput = e => { S.scale = Number(e.target.value); out(); refresh(); };
      $('#ff-rot').oninput = e => { S.rot = Number(e.target.value); out(); refresh(); };
      const hb = $('#ff-hint');
      hb.onclick = () => { S.hint = !S.hint; hb.classList.toggle('on', S.hint); hb.setAttribute('aria-checked', String(S.hint)); };
      $('#ff-repl').onclick = () => pickPattern(async fd => {
        await keepEdits();
        const r = await sendForm('/api/at/assets/' + cur.id + '/ar-pattern', fd);
        if(r.success) await reopen();
      });
      $('#ff-content').onclick = () => {
        const inp = $('#f-asset'); inp.value = ''; inp.accept = '.glb,image/png,image/jpeg,image/webp,video/mp4,video/webm';
        inp.onchange = async e => {
          const f = e.target.files[0]; if(!f) return;
          $('#ff-err').textContent = '';
          busy(true, 'Wird hochgeladen …');
          await keepEdits();
          const fd = new FormData(); fd.append('file', f);
          const r = await sendForm('/api/at/assets/' + cur.id + '/ar-content', fd);
          busy(false);
          if(r.success) await reopen();
        };
        inp.click();
      };
      if($('#ff-content-del')) $('#ff-content-del').onclick = async () => {
        await keepEdits();
        await api('DELETE', '/assets/' + cur.id + '/ar-content');
        await reopen();
      };
      ff.querySelectorAll('[data-arc]').forEach(b => b.onclick = async () => {
        await keepEdits();
        const r = await api('POST', '/assets/' + cur.id + '/ar-content', { sample: b.dataset.arc });
        if(!r || !r.success){ $('#ff-err').textContent = FIND_ERR[r && r.error] || 'Das hat nicht geklappt.'; return; }
        await reopen();
      });
      $('#ff-cam').onclick = () => arCamera(cur, { place: S.place, scale: S.scale, rot: S.rot });
      $('#ff-save').onclick = async () => {
        const r = await keepEdits();
        if(r && r.error){ $('#ff-err').textContent = FIND_ERR[r.error] || r.error; return; }
        await openTrail(TRAIL.id);
      };
      $('#ff-cancel').onclick = () => { ff.innerHTML = ''; dropArBlobs(); };
      ff.scrollIntoView({ block:'nearest' });
    };
    const form = (k, cur) => {
      if(k === 'ar') return arForm(cur);
      const ff = $('#find-form');
      const head = '<div class="findform"><b>'+(cur ? 'Bearbeiten: ' : '')+(FIND_LABEL[k]||k)+'</b>';
      const titleF = field('Titel, so sieht das Team den Fund','ff-title',cur ? cur.title : '');
      let body = '';
      if(k === 'link')  body = field('Adresse','ff-ref',cur ? cur.ref : 'https://',false,'Eine echte Webseite oder eine, die ihr selbst ins Netz gestellt habt.');
      if(k === 'phone') body = field('Nummer','ff-ref',cur ? cur.ref : '',false,'Mit Landesvorwahl, z. B. +41 79 123 45 67. Das Team ruft direkt aus dem Trail an.');
      if(k === 'email') body = field('Adresse','ff-ref',cur ? cur.ref : '',false,'Mit automatischer Antwort wird daraus ein Rätsel.')
                             + field('Betreff (vorausgefüllt)','ff-subject',cur && cur.meta ? cur.meta.subject : '');
      if(k === 'note')  body = '<div class="fld"><label>Aussehen</label><div class="seg" style="margin-left:0">'
                             + [['letter','Brief'],['message','Nachricht'],['note','Notizzettel']].map(([v,t]) =>
                                 '<button type="button" data-look="'+v+'" aria-pressed="'+(((cur&&cur.meta&&cur.meta.look)||'letter')===v)+'">'+t+'</button>').join('')
                             + '</div></div>' + field('Text · '+l,'ff-body',cur ? tx(cur.body,l) : '',true,'Zeilenumbrüche bleiben, wie du sie schreibst.');
      if(k === 'page')  body = field('Adresszeile, die angezeigt wird','ff-shown',cur && cur.meta ? cur.meta.display_url : '',false,'Nur zur Anzeige, z. B. www.kellerei-ilse.ch. Die Seite selbst kommt aus der Datei.');
      if(k === 'model') body = '<p class="hint">Eine .glb-Datei, am besten unter 10 MB, damit sie auch unterwegs schnell lädt. Aus Blender: Datei, Exportieren, glTF 2.0, „glTF Binary“.</p>'
                             + (cur ? '' : '<div class="fld"><label>Oder ein Beispiel zum Ausprobieren'+tipdot('sample3d')+'</label><div class="row2" style="margin-top:0">'
                                    + '<button class="btn" type="button" data-sample="chest">Schatztruhe</button>'
                                    + '<button class="btn" type="button" data-sample="key">Alter Schlüssel</button></div></div>')
                             + (cur ? '<div class="fld"><label>iPhone-Datei (.usdz)</label><button class="btn" type="button" id="ff-usdz" style="width:100%">'
                                    + (cur.meta && cur.meta.usdz ? 'iPhone-Datei ersetzen' : 'iPhone-Datei hinzufügen') + '</button>'
                                    + '<p class="hint">Freiwillig. Ohne sie baut das iPhone das Objekt selbst; mit ihr sieht es im Raum am genauesten aus.</p></div>' : '');
      ff.innerHTML = head + titleF + body + '<div class="row2">'
        + (k === 'model' && !cur ? '<button class="btn primary" type="button" id="ff-file">GLB-Datei wählen</button>'
         : k === 'page' && !cur ? '<button class="btn primary" type="button" id="ff-file">HTML-Datei wählen</button>'
                                 : '<button class="btn primary" type="button" id="ff-save">Speichern</button>')
        + '<button class="btn" type="button" id="ff-cancel">Abbrechen</button></div><div id="ff-err" class="hint" style="color:var(--stop)"></div></div>';
      ff.querySelectorAll('[data-look]').forEach(bt => bt.onclick = () =>
        ff.querySelectorAll('[data-look]').forEach(x => x.setAttribute('aria-pressed', String(x === bt))));
      $('#ff-cancel').onclick = () => { ff.innerHTML = ''; };
      const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : undefined; };
      const look = () => { const on = ff.querySelector('[data-look][aria-pressed="true"]'); return on ? on.dataset.look : 'letter'; };
      if($('#ff-file')) $('#ff-file').onclick = () => k === 'model'
        ? pickFile('.glb', { kind:'model', title: val('ff-title') })
        : pickFile('.html,.htm', { kind:'page', title: val('ff-title'), display_url: val('ff-shown') });
      ff.querySelectorAll('[data-sample]').forEach(bt => bt.onclick = async () => {
        const r = await api('POST', '/nodes/' + n.id + '/assets/sample', { sample: bt.dataset.sample });
        if(r && r.error){ $('#ff-err').textContent = r.error; return; }
        await openTrail(TRAIL.id);
      });
      if($('#ff-usdz')) $('#ff-usdz').onclick = () => {
        const inp = $('#f-asset'); inp.value = ''; inp.accept = '.usdz';
        inp.onchange = async e => {
          const f = e.target.files[0]; if(!f) return;
          const fd = new FormData(); fd.append('file', f);
          const r = await fetch('/api/at/assets/' + cur.id + '/usdz', { method:'POST', headers: TOKEN?{Authorization:'Bearer '+TOKEN}:{}, body:fd });
          const j = await r.json().catch(()=>({}));
          if(!j.success) return uiAlert(FIND_ERR[j.error] || ('Upload fehlgeschlagen: ' + (j.error||r.status)));
          await openTrail(TRAIL.id);
        };
        inp.click();
      };
      if($('#ff-save')) $('#ff-save').onclick = async () => {
        const data = { title: val('ff-title') };
        if(['link','phone','email'].includes(k)) data.ref = val('ff-ref');
        if(k === 'email') data.meta = { subject: val('ff-subject') };
        if(k === 'note'){ data.body = Object.assign({}, cur ? cur.body : {}, { [l]: $('#ff-body').value }); data.meta = { look: look() }; }
        if(k === 'page') data.meta = { display_url: val('ff-shown') };
        const r = cur ? await api('PUT', '/assets/' + cur.id, data)
                      : await api('POST', '/nodes/' + n.id + '/assets/entry', Object.assign({ kind:k }, data));
        if(r && r.error){ $('#ff-err').textContent = FIND_ERR[r.error] || r.error; return; }
        await openTrail(TRAIL.id);
      };
      ff.scrollIntoView({ block:'nearest' });
    };
    p.querySelectorAll('[data-add-find]').forEach(bt => bt.onclick = () => {
      const k = bt.dataset.addFind;
      if(k === 'media') return pickFile('image/*,audio/*,video/*,.pdf', {});
      if(k === 'file')  return pickFile(FILE_ACCEPT, { kind:'file' });
      form(k, null);
    });
    p.querySelectorAll('[data-find-edit]').forEach(bt => bt.onclick = () => {
      const x = as.find(y => y.id === Number(bt.dataset.findEdit)); if(x) form(x.kind, x);
    });
    p.querySelectorAll('[data-find-view]').forEach(bt => bt.onclick = () => {
      const x = as.find(y => y.id === Number(bt.dataset.findView));
      return x && x.kind === 'model' ? previewModel(x) : previewPage(Number(bt.dataset.findView));
    });
    p.querySelectorAll('[data-asset-del]').forEach(bt => bt.onclick = async () => {
      if(!await uiConfirm('Diesen Fund löschen?', { ok:'Löschen' })) return;
      await api('DELETE', '/assets/' + bt.dataset.assetDel); await openTrail(TRAIL.id);
    });
    // After an upload the trail is read anew; the find that was being worked
    // on opens again, so the next step follows on.
    if(reopenFind){
      const x = as.find(y => y.id === reopenFind); reopenFind = null;
      if(x) form(x.kind, x);
    }
  }
  else if(tab === 'text'){
    p.innerHTML = field('Titel · '+l,'f-title',tx(n.title,l))
      + field('Text · '+l,'f-task',tx(n.task,l),true,'Was hier auf dem Bildschirm steht.');
  }
  else if(tab === 'peilung'){
    const t = navTargetOf(n);
    p.innerHTML = '<div class="fld"><label>Art der Peilung'+tipdot('navmode')+'</label>'
      + '<select class="sel" id="f-nav">'
      + '<option value="distance"'+(n.nav_mode!=='arrow'?' selected':'')+'>Distanz, wärmer und kälter</option>'
      + '<option value="arrow"'+(n.nav_mode==='arrow'?' selected':'')+'>Pfeil, zeigt die Richtung</option></select>'
      + '<p class="hint">Distanz sagt wie weit, nicht wohin, und lässt das Rätsel „wo“ bestehen. Ein Pfeil ersetzt es durch Navigation und braucht zusätzlich den Kompass.</p></div>'
      + '<div class="fld"><label>Zeigt auf</label>'
      + (t ? '<div class="rung" style="border:0;padding:0"><span class="n">→</span><span class="c">'
             + '<b style="font:600 13px/1.3 var(--body)">'+esc(tx(t.title)||('#'+t.id))+'</b>'
             + '<div class="hint" style="margin-top:3px">'+t.lat.toFixed(5)+', '+t.lng.toFixed(5)+'</div></span></div>'
           : '<p class="hint" style="margin:0;color:var(--warn)">Noch nichts. Verbinde die Peilung mit einem Baustein, der einen Ort hat.</p>')
      + '<p class="hint">Eine Peilung hat keinen eigenen Ort. Sie liest den Ort des nächsten verbundenen Bausteins, also verschiebt sich die Peilung automatisch mit, wenn die Station umzieht.</p></div>'
      + '<p class="hint">Kein Auslöser, keine Antwort, kein Radius: hier wird nichts freigeschaltet, es wird nur gezeigt, wie weit es noch ist.</p>';
  }
  else if(tab === 'choices'){
    const outs = EDGES.filter(e => e.from_node === n.id);
    p.innerHTML = '<p class="hint" style="margin:0 0 12px">Jeder ausgehende Pfeil ist ein Zweig. Die Beschriftung ist der Text auf dem Knopf, den das Team sieht.</p>'
      + (outs.length ? outs.map((e,i) => {
          const t = NODES.find(x => x.id === e.to_node);
          return '<div class="rung" data-edge="'+e.from_node+'-'+e.to_node+'"><span class="n">'+(i+1)+'</span><span class="c">'
            + '<input class="inp" data-c="label" value="'+esc(tx(e.label))+'" placeholder="Beschriftung">'
            + '<span class="row"><input class="inp" data-c="key" value="'+esc(e.branch_key||'')+'" placeholder="Zweig-Kürzel"></span>'
            + '<div class="hint" style="margin-top:4px">→ '+esc(t?(tx(t.title)||('#'+t.id)):'?')+'</div></span></div>';
        }).join('')
        : '<p class="hint" style="margin:0;color:var(--warn)">Noch keine Zweige. Zieh aus dem unteren Punkt der Weiche zwei Verbindungen heraus.</p>')
      + '<p class="hint">Das Kürzel markiert alles dahinter. Ein Baustein hinter „geld“ erscheint nur für Teams, die diesen Zweig gewählt haben.</p>';
  }
  else if(tab === 'style'){
    // The page itself is designed in its own room; here it is seen small.
    const has = ATDesign.has(n.design);
    p.innerHTML = '<div class="dthumb" id="d-thumb"'+(has ? '' : ' data-empty="1"')+'><div class="atd-stage"></div>'
      + (has ? '' : '<span>Noch nicht gestaltet. Der Baustein sieht aus wie alle anderen.</span>') + '</div>'
      + '<button class="btn primary" id="b-design" style="width:100%">'+(has ? 'Seite bearbeiten' : 'Seite gestalten')+'</button>'
      + '<p class="hint">Im Seiten-Designer: Hintergrundbild, eigene Knöpfe und Bild-Knöpfe, ein Video im Fernseher, Texte. Alles frei platzierbar, in Ebenen, auch mit transparenten Bildern.</p>';
    if(has){
      const box = $('#d-thumb'), stage = box.querySelector('.atd-stage');
      ATDesign.render(stage, n.design, { mode:'thumb', lang:L1(),
        storyVideo: n.story_media === 'video' && n.story_media_path ? '/uploads/' + n.story_media_path : '' });
      requestAnimationFrame(() => ATDesign.fit(stage, box));
    }
    $('#b-design').onclick = () => {
      location.href = '/at-designer.html?node=' + n.id + '&trail=' + TRAIL.id
        + (new URLSearchParams(location.search).get('embed') === '1' ? '&embed=1' : '');
    };
  }
}
// Read the hint ladder back out of the DOM. Anything that re-renders the panel
// has to call this first, or whatever was typed since the last save is gone.
function collectHints(n, l){
  const rows = [...document.querySelectorAll('#ladder .rung')];
  if(!rows.length) return n.hints || [];
  return rows.map((r, i) => {
    const prev = (n.hints || [])[i] || {};
    return {
      text: Object.assign({}, prev.text || {}, { [l]: r.querySelector('[data-h=text]').value }),
      after_minutes: Number(r.querySelector('[data-h=min]').value) || 0,
      resolves: r.querySelector('[data-h=res]').checked,
    };
  });
}
async function saveNode(n){
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : undefined; };
  const body = {};
  const l = L1();
  const setI18n = (key, v) => { if(v === undefined) return; body[key] = Object.assign({}, n[key]||{}, { [l]: v }); };
  if(tab === 'trigger'){
    body.trigger_kind = g('f-trigger'); body.post_code = g('f-postcode') || null;
    body.lat = g('f-lat') === '' ? null : Number(g('f-lat'));
    body.lng = g('f-lng') === '' ? null : Number(g('f-lng'));
    body.radius_m = Number(g('f-radius')) || 45;
    body.nav_mode = g('f-nav'); body.skip_after_min = Number(g('f-skip')) || 0;
  } else if(tab === 'ort'){
    // "Überall" saves itself the moment it is chosen; only a place has fields.
    if(n.trigger_kind === 'gps'){
      body.trigger_kind = 'gps'; body.post_code = g('f-postcode') || null;
      body.lat = g('f-lat') === '' ? null : Number(g('f-lat'));
      body.lng = g('f-lng') === '' ? null : Number(g('f-lng'));
      body.radius_m = Number(g('f-radius')) || 45;
      body.nav_mode = g('f-nav'); body.skip_after_min = Number(g('f-skip')) || 0;
    }
  } else if(tab === 'story'){
    setI18n('task', g('f-task')); setI18n('arrive', g('f-arrive'));
    setI18n('depart', g('f-depart')); setI18n('title', g('f-title'));
  } else if(tab === 'riddle'){
    const raw = g('f-answers') || '';
    body.answers = Object.assign({}, n.answers||{}, { [l]: raw.split(',').map(s=>s.trim()).filter(Boolean) });
    body.answer_case_sensitive = $('#f-case').classList.contains('on') ? 1 : 0;
    body.points = Number(g('f-points')) || 0;
  } else if(tab === 'hints'){
    body.hints = collectHints(n, l);
  } else if(tab === 'style'){
    // The page designer saves on its own.
  } else if(tab === 'text'){
    setI18n('title', g('f-title')); setI18n('task', g('f-task'));
  } else if(tab === 'peilung'){
    body.nav_mode = g('f-nav') || 'distance';
    // A bearing never locks anything, so it must not carry a trigger.
    body.trigger_kind = 'none'; body.lat = null; body.lng = null;
  } else if(tab === 'choices'){
    for(const row of document.querySelectorAll('[data-edge]')){
      const [from, to] = row.dataset.edge.split('-').map(Number);
      await api('POST', '/trails/' + TRAIL.id + '/edges', {
        from, to,
        label: { [l]: row.querySelector('[data-c=label]').value },
        branch_key: row.querySelector('[data-c=key]').value.trim() || null,
      });
    }
  }
  await api('PUT', '/nodes/' + n.id, body);
  await openTrail(TRAIL.id);
}

// Click the map to place this node's point. Stays armed until a click lands,
// and the pin is draggable afterwards, so fine tuning never needs the form.
let picking = false;
function armPicker(){
  const b = $('#b-pick'); if(!b) return;
  b.onclick = () => {
    picking = !picking;
    b.classList.toggle('primary', picking);
    b.textContent = picking ? 'Klick jetzt auf die Karte' : 'Auf der Karte wählen';
    if(map) map.getContainer().style.cursor = picking ? 'crosshair' : '';
  };
}
function onMapClick(ev){
  if(!picking) return;
  const n = NODES.find(x => x.id === selId); if(!n) return;
  picking = false;
  if(map) map.getContainer().style.cursor = '';
  n.lat = +ev.latlng.lat.toFixed(6); n.lng = +ev.latlng.lng.toFixed(6);
  api('PUT', '/nodes/' + n.id, { lat:n.lat, lng:n.lng }).then(() => { render(); runCheck(); });
}

// ── Check ────────────────────────────────────────────────────────────────────
async function runCheck(){
  if(!TRAIL) return;
  const r = await api('GET', '/trails/' + TRAIL.id + '/check');
  const chip = $('#check-chip');
  const errs = r.errors || 0, warns = (r.issues||[]).length - errs;
  chip.className = 'chip ' + (errs ? 'bad' : warns ? 'warn' : 'ok');
  chip.textContent = errs ? errs + ' Fehler' : warns ? warns + ' Hinweise' : 'Alles sauber';
  chip.onclick = () => {
    $('#modal-in').innerHTML = '<h3>Prüfung</h3><div class="issues">'
      + ((r.issues||[]).map(i => '<div class="issue '+i.level+'" data-node="'+(i.node||'')+'"><i></i><span>'+esc(i.msg)+'</span></div>').join('')
         || '<p class="hint" style="margin:0">Nichts gefunden. Der Trail kann live gehen.</p>')
      + '</div><button class="btn" id="b-close" style="width:100%;margin-top:14px">Schliessen</button>';
    $('#modal').classList.add('on');
    $('#b-close').onclick = () => $('#modal').classList.remove('on');
    $('#modal-in').querySelectorAll('[data-node]').forEach(e => e.onclick = () => {
      if(!e.dataset.node) return;
      selId = Number(e.dataset.node); $('#modal').classList.remove('on'); render();
    });
  };
}

// ── Keys ─────────────────────────────────────────────────────────────────────
$('#b-keys').addEventListener('click', async () => {
  if(!TRAIL) return;
  const keys = await api('GET', '/trails/' + TRAIL.id + '/keys');
  const open = keys.filter(k => !k.run_id).length;
  $('#modal-in').innerHTML = '<h3>Schlüssel</h3>'
    + '<p class="hint" style="margin:0 0 12px">'+keys.length+' insgesamt, '+open+' noch nicht eingelöst. Status des Trails: <b>'+esc(TRAIL.status)+'</b>.</p>'
    + '<div class="fld"><label>Wie viele neue</label><input class="inp" id="f-count" value="10"></div>'
    + '<button class="btn primary" id="b-mint" style="width:100%">Erzeugen</button>'
    + '<div class="fld" style="margin-top:14px"><label>Trail-Status</label><select class="sel" id="f-status">'
    + ['draft','live','retired'].map(s => '<option value="'+s+'"'+(TRAIL.status===s?' selected':'')+'>'+s+'</option>').join('')
    + '</select><p class="hint">Nur ein Trail mit Status live kann eingelöst werden.</p></div>'
    + '<div id="minted" class="codes"></div>'
    + '<button class="btn" id="b-close" style="width:100%;margin-top:14px">Schliessen</button>';
  $('#modal').classList.add('on');
  $('#b-close').onclick = () => $('#modal').classList.remove('on');
  $('#f-status').onchange = async e => { await api('PUT', '/trails/' + TRAIL.id, { status:e.target.value }); TRAIL.status = e.target.value; runCheck(); };
  $('#b-mint').onclick = async () => {
    const r = await api('POST', '/trails/' + TRAIL.id + '/keys', { count: Number($('#f-count').value)||1 });
    $('#minted').textContent = (r.codes||[]).join('  ');
  };
});

// ── View toggle ──────────────────────────────────────────────────────────────
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.seg button').forEach(x => x.removeAttribute('aria-pressed'));
  b.setAttribute('aria-pressed','true');
  const v = b.dataset.view;
  $('#stage').style.gridTemplateColumns = v==='flow' ? '1fr 0' : v==='map' ? '0 1fr' : '1fr 1fr';
  $('#pane-flow').style.display = v==='map' ? 'none' : 'flex';
  $('#pane-map').style.display  = v==='flow' ? 'none' : 'flex';
  setTimeout(() => { drawEdges(); if(map) map.invalidateSize(); }, 40);
}));

// Embedded in the MiSSiONS settings the page already sits under a header, so
// the studio drops its own brand block and reclaims the row.
if(new URLSearchParams(location.search).get('embed') === '1'){
  document.body.classList.add('embed');
  const b = document.querySelector('.brand'); if(b) b.remove();
}
loadTrails().catch(e => {
  console.error(e);
  document.getElementById('inspector').innerHTML =
    '<div class="empty">Das Studio konnte nicht laden.<br><br>' + esc(e && e.message || e) + '</div>';
});
</script>
