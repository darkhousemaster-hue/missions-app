<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<title>MiSSiONS — Join</title>
<link rel="stylesheet" href="/css/app.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:var(--bg);}
.join-wrap{width:100%;max-width:400px;}
/* Player-side logo — always perfectly centered regardless of viewport
   quirks. Flexbox guarantees it sits on the optical centre of the join
   panel; the inner <img> and <h1> centre themselves via auto margins
   and a flex column. */
.logo-area{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0 auto 2.5rem;width:100%;}
.logo-area img{display:block;height:64px;width:auto;margin:0 auto;mix-blend-mode:screen;}
.logo-area h1{font-size:3rem;letter-spacing:.15em;color:var(--red);margin:.5rem auto 0;}
.loc-sub{font-size:.85rem;color:var(--text-muted);margin-top:.3rem;}
.gameid-sub{font-family:var(--mono);font-size:.8rem;color:var(--orange);margin-top:.15rem;}
.join-choice{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem;}
.join-choice .btn-choice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1.25rem .75rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text);font-family:var(--body);font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;text-align:center;transition:all .15s;}
.join-choice .btn-choice .icon{font-size:1.6rem;line-height:1;}
.join-choice .btn-choice:hover{border-color:var(--red);color:var(--red-light);background:rgba(212,43,43,.06);}
.join-choice .btn-choice.disabled{opacity:.45;cursor:not-allowed;}
.join-choice .btn-choice.disabled:hover{border-color:var(--border);color:var(--text);background:var(--surface);}
.error-msg{color:var(--red-light);font-size:.85rem;margin-top:.4rem;min-height:1.2em;}
.team-row{display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.4rem;}
.team-row-name{flex:1;font-weight:600;}
.team-row-pts{font-family:var(--mono);font-size:.75rem;color:var(--orange);}
.back-link{display:inline-flex;align-items:center;gap:.3rem;background:transparent;border:none;color:var(--text-muted);font-family:var(--body);font-size:.85rem;cursor:pointer;padding:0;margin-bottom:.75rem;}
.back-link:hover{color:var(--text);}
</style>
</head>
<body>
<div class="join-wrap">
  <div class="logo-area">
    <img src="/assets/logo.png" alt="AR">
    <h1><span>MiSSi</span><span>ONS</span></h1>
    <div class="loc-sub" id="location-info"></div>
    <div class="gameid-sub" id="game-id-display"></div>
  </div>

  <div id="screen-loading"><p style="color:var(--text-muted);text-align:center;">Laden…</p></div>

  <div id="screen-error" style="display:none;text-align:center;">
    <h2 style="color:var(--red-light);margin-bottom:.75rem;">Fehler</h2>
    <p style="color:var(--text-dim);" id="error-detail">Ungültiger Code oder Spiel beendet.</p>
    <p style="color:var(--text-dim);margin-top:.5rem;">Bitte den Spielleiter um einen neuen Code.</p>
  </div>

  <div id="screen-join" style="display:none;">
    <!-- Two big buttons: pick "create new" or "join existing" up front. -->
    <div class="join-choice" id="join-choice">
      <button class="btn-choice" id="btn-go-new"  onclick="switchTab('new')">
        <span class="icon">＋</span><span>Neues Team erstellen</span>
      </button>
      <button class="btn-choice" id="btn-go-join" onclick="switchTab('join')">
        <span class="icon">👥</span>
        <span>Team beitreten</span>
        <small id="btn-go-join-count" style="font-family:var(--mono);font-size:.7rem;color:var(--text-muted);"></small>
      </button>
    </div>

    <!-- New team panel -->
    <div id="panel-new" style="display:none;">
      <button class="back-link" onclick="showChoice()">← Zurück</button>
      <div class="field">
        <label class="label">Teamname</label>
        <input id="team-name" class="input" type="text" placeholder="Teamname eingeben…"
               maxlength="30" autocomplete="off" autocorrect="off" autocapitalize="words">
      </div>
      <p class="error-msg" id="error-msg"></p>
      <button class="btn btn-primary btn-full btn-lg" id="btn-join" onclick="joinAsNew()">
        MiSSiON starten →
      </button>
    </div>

    <!-- Join existing team panel -->
    <div id="panel-join" style="display:none;">
      <button class="back-link" onclick="showChoice()">← Zurück</button>
      <div id="teams-list"></div>
      <p style="font-size:.8rem;color:var(--text-muted);margin-top:.75rem;text-align:center;">
        Du siehst dieselben MiSSiONS und kannst unabhängig Medien einreichen.
      </p>
    </div>
  </div>
</div>

<script>
'use strict';
const params = new URLSearchParams(window.location.search);
const gameId = params.get('game');
let existingTeams = [];

// Minimal i18n. join.html has no language picker — auto-detect from the
// browser language and fall back to German (the original UI language).
// localStorage carries the language pick made on /play or /cityrush so a
// returning player sees join.html in the same language they last used.
const JOIN_LANGS = ['de','en','fr','it','es'];
function _detectJoinLang() {
  const stored = localStorage.getItem('m_lang') || localStorage.getItem('cr_lang');
  if (stored && JOIN_LANGS.includes(stored)) return stored;
  const nav = (navigator.language || navigator.userLanguage || 'de').slice(0,2).toLowerCase();
  return JOIN_LANGS.includes(nav) ? nav : 'de';
}
let joinLang = _detectJoinLang();
const JOIN_T = {
  de: {loading:'Laden…', error:'Fehler', invalid:'Ungültiger Code oder Spiel beendet.', ask_gm:'Bitte den Spielleiter um einen neuen Code.', game_ended:'Dieses Spiel ist bereits beendet.', create_team:'Neues Team erstellen', join_team:'Team beitreten', back:'← Zurück', teamname:'Teamname', teamname_ph:'Teamname eingeben…', start:'MiSSiON starten →', team_hint:'Du siehst dieselben MiSSiONS und kannst unabhängig Medien einreichen.', enter_name:'Bitte Teamnamen eingeben.', min_chars:'Name muss mind. 2 Zeichen haben.', waiting:'Warte…', join_btn:'Beitreten', conn_err:'Verbindungsfehler. Bitte erneut versuchen.', err_default:'Fehler. Bitte erneut versuchen.'},
  en: {loading:'Loading…', error:'Error', invalid:'Invalid code or game ended.', ask_gm:'Please ask the Gamemaster for a new code.', game_ended:'This game has already ended.', create_team:'Create new team', join_team:'Join team', back:'← Back', teamname:'Team name', teamname_ph:'Enter team name…', start:'Start MiSSiON →', team_hint:'You see the same MiSSiONS and can submit media independently.', enter_name:'Please enter a team name.', min_chars:'Name must be at least 2 characters.', waiting:'Waiting…', join_btn:'Join', conn_err:'Connection error. Please try again.', err_default:'Error. Please try again.'},
  fr: {loading:'Chargement…', error:'Erreur', invalid:'Code invalide ou partie terminée.', ask_gm:'Demande un nouveau code au Gamemaster.', game_ended:'Cette partie est déjà terminée.', create_team:'Créer une nouvelle équipe', join_team:'Rejoindre une équipe', back:'← Retour', teamname:'Nom d\'équipe', teamname_ph:'Saisir le nom de l\'équipe…', start:'Commencer la MiSSiON →', team_hint:'Tu vois les mêmes MiSSiONS et peux envoyer des médias indépendamment.', enter_name:'Veuillez saisir un nom d\'équipe.', min_chars:'Le nom doit faire au moins 2 caractères.', waiting:'Attente…', join_btn:'Rejoindre', conn_err:'Erreur de connexion. Réessaie.', err_default:'Erreur. Réessaie.'},
  it: {loading:'Caricamento…', error:'Errore', invalid:'Codice non valido o partita terminata.', ask_gm:'Chiedi al Gamemaster un nuovo codice.', game_ended:'Questa partita è già terminata.', create_team:'Crea una nuova squadra', join_team:'Unisciti a una squadra', back:'← Indietro', teamname:'Nome squadra', teamname_ph:'Inserisci il nome della squadra…', start:'Avvia MiSSiON →', team_hint:'Vedi le stesse MiSSiONS e puoi inviare media in modo indipendente.', enter_name:'Inserisci il nome della squadra.', min_chars:'Il nome deve avere almeno 2 caratteri.', waiting:'Attendi…', join_btn:'Unisciti', conn_err:'Errore di connessione. Riprova.', err_default:'Errore. Riprova.'},
  es: {loading:'Cargando…', error:'Error', invalid:'Código no válido o partida finalizada.', ask_gm:'Pide al Gamemaster un nuevo código.', game_ended:'Esta partida ya ha terminado.', create_team:'Crear nuevo equipo', join_team:'Unirse a un equipo', back:'← Volver', teamname:'Nombre del equipo', teamname_ph:'Escribe el nombre del equipo…', start:'Iniciar MiSSiON →', team_hint:'Verás las mismas MiSSiONS y podrás enviar contenido de forma independiente.', enter_name:'Introduce el nombre del equipo.', min_chars:'El nombre debe tener al menos 2 caracteres.', waiting:'Esperando…', join_btn:'Unirse', conn_err:'Error de conexión. Inténtalo de nuevo.', err_default:'Error. Inténtalo de nuevo.'},
};
function jt(k) { return (JOIN_T[joinLang] || JOIN_T.de)[k] || k; }
function ensureCrPlayerKey() {
  if (sessionStorage.getItem('crPlayerKey')) return;
  var k = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID()
    : 'pk_' + Math.random().toString(36).slice(2) + Date.now();
  sessionStorage.setItem('crPlayerKey', k);
}

document.documentElement.lang = joinLang;
document.getElementById('game-id-display').textContent = gameId ? '#' + gameId : '';
// Translate the static strings sitting in the markup. Hoisted from an IIFE
// so the per-location language restriction below can re-call it after
// snapping joinLang to whatever the location actually permits.
function _applyJoinTranslations(){
  document.documentElement.lang = joinLang;
  const loading = document.querySelector('#screen-loading p');
  if(loading) loading.textContent = jt('loading');
  const errH = document.querySelector('#screen-error h2');
  if(errH) errH.textContent = jt('error');
  const errDetail = document.getElementById('error-detail');
  if(errDetail) errDetail.textContent = jt('invalid');
  const askGm = document.querySelector('#screen-error p:last-of-type');
  if(askGm) askGm.textContent = jt('ask_gm');
  const btnNewLbl = document.querySelector('#btn-go-new span:not(.icon)');
  if(btnNewLbl) btnNewLbl.textContent = jt('create_team');
  const btnJoinLbl = document.querySelector('#btn-go-join > span:not(.icon)');
  if(btnJoinLbl) btnJoinLbl.textContent = jt('join_team');
  document.querySelectorAll('.back-link').forEach(b => b.textContent = jt('back'));
  const teamLabel = document.querySelector('#panel-new .label');
  if(teamLabel) teamLabel.textContent = jt('teamname');
  const teamInput = document.getElementById('team-name');
  if(teamInput) teamInput.placeholder = jt('teamname_ph');
  const startBtn = document.getElementById('btn-join');
  if(startBtn) startBtn.textContent = jt('start');
  const teamHint = document.querySelector('#panel-join p');
  if(teamHint) teamHint.textContent = jt('team_hint');
}
_applyJoinTranslations();

// Snap joinLang to the location's allowed list if the auto-detected language
// isn't permitted there. Called after the game fetch in the DOMContentLoaded
// handler below.
function _applyJoinAllowedLangs(csv){
  const arr = String(csv || '').split(',').map(s => s.trim()).filter(l => JOIN_LANGS.includes(l));
  if (arr.length === 0 || arr.includes(joinLang)) return;
  joinLang = arr[0];
  localStorage.setItem('m_lang', joinLang);  // so /play and /cityrush also pick it up
  _applyJoinTranslations();
}

window.addEventListener('DOMContentLoaded', async () => {
  if (!gameId) { show('error'); return; }

  // Already joined this exact game — go straight to play / CityRush
  const storedGame = sessionStorage.getItem('gameId');
  const storedTeam = sessionStorage.getItem('teamId');
  if (storedGame === gameId && storedTeam) {
    ensureCrPlayerKey();
    var g = await fetch('/api/games/' + gameId).then(function(r) { return r.json(); }).catch(function() { return null; });
    var pg = (g && g.crMode) ? '/cityrush.html' : '/play.html';
    window.location.href = pg + '?game=' + gameId + '&team=' + storedTeam;
    return;
  }

  try {
    const res = await fetch('/api/games/' + gameId);
    if (!res.ok) { show('error'); return; }
    const game = await res.json();

    if (game.status === 'ended') {
      document.getElementById('error-detail').textContent = jt('game_ended');
      show('error'); return;
    }

    if (game.location) {
      document.getElementById('location-info').textContent = '📍 ' + game.location.name;
      // If the location restricts the language list, snap joinLang into the
      // allowed set before the player even sees the join screen.
      if (game.location.allowed_langs) _applyJoinAllowedLangs(game.location.allowed_langs);
    }
    // If game has CityRush mode AND no normal missions, go to cityrush page
    if (game.crMode) {
      document.getElementById('location-info').textContent += '  🏃 CityRush: ' + game.crMode.name;
    }

    existingTeams = game.teams || [];
    renderTeamsList();
    refreshJoinChoice();

    show('join');
    showChoice();   // start at the two-button choice screen
    const inp = document.getElementById('team-name');
    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') joinAsNew(); });
  } catch(e) {
    show('error');
  }
});

function renderTeamsList() {
  const list = document.getElementById('teams-list');
  list.innerHTML = '';
  existingTeams.forEach(function(t) {
    const row = document.createElement('div');
    row.className = 'team-row';
    row.innerHTML =
      '<span class="team-row-name">' + esc(t.name) + '</span>' +
      '<span class="team-row-pts">' + t.score + ' pt</span>';
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary btn-sm';
    btn.textContent = jt('join_btn');
    btn.addEventListener('click', function() { joinExisting(t.id, t.name); });
    row.appendChild(btn);
    list.appendChild(row);
  });
}

function switchTab(tab) {
  // "Join existing" is disabled when no teams exist yet — bail out so the
  // choice screen stays the entry point.
  if(tab === 'join' && existingTeams.length === 0) return;
  document.getElementById('join-choice').style.display = 'none';
  document.getElementById('panel-new').style.display   = tab === 'new'  ? 'block' : 'none';
  document.getElementById('panel-join').style.display  = tab === 'join' ? 'block' : 'none';
  if(tab === 'new'){
    const inp = document.getElementById('team-name');
    if(inp) inp.focus();
  }
}
// Show the two-button landing.
function showChoice() {
  document.getElementById('join-choice').style.display = 'grid';
  document.getElementById('panel-new').style.display   = 'none';
  document.getElementById('panel-join').style.display  = 'none';
  refreshJoinChoice();
}
// Reflect current team count in the join button (count + disabled state).
function refreshJoinChoice() {
  const cnt = existingTeams.length;
  const lbl = document.getElementById('btn-go-join-count');
  if(lbl) lbl.textContent = cnt > 0 ? `(${cnt})` : '';
  const btn = document.getElementById('btn-go-join');
  if(btn) btn.classList.toggle('disabled', cnt === 0);
}

async function joinAsNew() {
  const name = document.getElementById('team-name').value.trim();
  const err  = document.getElementById('error-msg');
  const btn  = document.getElementById('btn-join');
  if (!name) { err.textContent = jt('enter_name'); return; }
  if (name.length < 2) { err.textContent = jt('min_chars'); return; }
  btn.disabled = true;
  btn.textContent = jt('waiting');
  err.textContent = '';

  try {
    ensureCrPlayerKey();
    var anchor = sessionStorage.getItem('crPlayerKey');
    const res = await fetch('/api/games/' + gameId + '/teams', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, gps_anchor_key: anchor })
    }).then(function(r) { return r.json(); });

    if (res.id) {
      sessionStorage.setItem('teamId',   String(res.id));
      sessionStorage.setItem('teamName', res.name);
      sessionStorage.setItem('gameId',   gameId);
      // Check if this game has CityRush
      const gameInfo = await fetch('/api/games/' + gameId).then(r=>r.json()).catch(()=>null);
      const targetPage = (gameInfo && gameInfo.crMode) ? '/cityrush.html' : '/play.html';
      window.location.href = targetPage + '?game=' + gameId + '&team=' + res.id;
    } else {
      err.textContent = res.error || jt('err_default');
      btn.disabled = false;
      btn.textContent = jt('start');
    }
  } catch(e) {
    err.textContent = jt('conn_err');
    btn.disabled = false;
    btn.textContent = jt('start');
  }
}

async function joinExisting(teamId, teamName) {
  ensureCrPlayerKey();
  sessionStorage.setItem('teamId',   String(teamId));
  sessionStorage.setItem('teamName', teamName);
  sessionStorage.setItem('gameId',   gameId);
  const gInfo = await fetch('/api/games/' + gameId).then(r=>r.json()).catch(()=>null);
  const pg = (gInfo && gInfo.crMode) ? '/cityrush.html' : '/play.html';
  window.location.href = pg + '?game=' + gameId + '&team=' + teamId;
}

function show(s) {
  ['loading', 'error', 'join'].forEach(function(n) {
    document.getElementById('screen-' + n).style.display = n === s ? 'block' : 'none';
  });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
