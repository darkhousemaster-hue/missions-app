name: Create Release on Version Change

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          # Read the version that was just pushed and the previous one. If
          # they match, there's no new release to make. fetch-depth: 2 above
          # guarantees HEAD~1 is available.
          CUR=$(node -p "require('./package.json').version")
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version||""))' 2>/dev/null || echo "")
          echo "current=$CUR" >> $GITHUB_OUTPUT
          echo "previous=$PREV" >> $GITHUB_OUTPUT
          if [ "$CUR" != "$PREV" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version bumped: ${PREV:-<none>} -> $CUR"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged ($CUR). Skipping release."
          fi

      - name: Create Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # softprops/action-gh-release creates the tag on the release commit
          # if it doesn't yet exist on the remote, and updates the existing
          # release if one is already attached to the tag. We deliberately
          # don't gate on tag presence — a manually pushed tag still gets a
          # release this way, fixing the prior "skipped because tag exists"
          # failure mode.
          tag_name: v${{ steps.version.outputs.current }}
          name: MiSSiONS v${{ steps.version.outputs.current }}
          body: |
            ## MiSSiONS v${{ steps.version.outputs.current }}

            ${{ github.event.head_commit.message }}

            ### Install on Raspberry Pi
            ```bash
            git clone https://github.com/darkhousemaster-hue/missions-app.git
            cd missions-app
            chmod +x setup-pi.sh
            ./setup-pi.sh
            ```

            ### Update existing install
            ```bash
            cd /home/admin/missions-app
            ./update.sh
            ```
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
