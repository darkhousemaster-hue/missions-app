<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CityRush — Player (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_shared.css">
<style>
  body { display:flex; align-items:center; justify-content:center; padding: 40px 20px; }

  .cr-header {
    padding: 50px 22px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .cr-header .score-pill .pt { color: var(--text-dim); }
  .cr-header .timer { font: 700 14px/1 var(--mono); color: var(--text); }

  .cr-progress { padding: 6px 22px 14px; }
  .cr-progress__bar { height: 4px; background: var(--surface); border-radius: 4px; overflow: hidden; }
  .cr-progress__bar > div { width: 38%; height: 100%; background: linear-gradient(90deg, var(--orange), #ffb066); }
  .cr-progress__meta { display: flex; justify-content: space-between; margin-top: 6px; font: 500 11px/1 var(--mono); color: var(--text-muted); letter-spacing: 0.04em; }

  .cr-map-card {
    margin: 0 18px 14px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
    overflow: hidden;
    background: #0a0a0a;
    position: relative;
    height: 200px;
  }
  .cr-map-svg { width: 100%; height: 100%; display: block; }
  .cr-map-card .arrived-pill {
    position: absolute; top: 12px; left: 12px;
    padding: 6px 10px;
    background: rgba(15,14,13,0.78);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    color: var(--text-dim);
    font: 600 10px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cr-map-card .arrived-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 4px rgba(232,95,30,0.18); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

  .cr-mission {
    margin: 0 18px 14px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
  }
  .cr-mission .step { font: 600 10px/1 var(--body); letter-spacing: 0.22em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
  .cr-mission h3 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.04em; margin: 0 0 6px; color: var(--text); }
  .cr-mission .desc { font: 400 13px/1.55 var(--body); color: var(--text-dim); margin-bottom: 12px; }
  .cr-mission .task { font: 500 13px/1.5 var(--body); color: var(--text); display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 10px; margin-bottom: 12px; }
  .cr-mission .task .arrow { color: var(--orange); flex-shrink: 0; font-weight: 700; }
  .cr-mission .meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .cr-actions {
    margin: 0 18px 14px;
    display: flex; gap: 8px;
  }
  .cr-actions .btn { flex: 1; padding: 13px 14px; font-size: 13px; }

  .cr-hints {
    margin: 0 18px 110px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px dashed var(--hairline);
    border-radius: var(--r-card);
  }
  .cr-hints .ht-row { display: flex; align-items: center; justify-content: space-between; }
  .cr-hints .ht-title { font: 700 11px/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
  .cr-hints .ht-count { font: 500 11px/1 var(--mono); color: var(--text-muted); }
  .cr-hints .ht-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--hairline); color: var(--text-dim); font: 600 11px/1 var(--body); margin-top: 10px; cursor: pointer; }
  .cr-hints .ht-pill svg { width: 12px; height: 12px; }

  .action-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 0 56px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, transparent 0%, rgba(15,14,13,0.95) 35%, var(--bg) 100%);
  }
  .nav-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-btn svg { width: 20px; height: 20px; }
  .camera-btn {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: var(--orange);
    color: #fff;
    border: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px -8px var(--orange);
    cursor: pointer;
  }
  .camera-btn svg { width: 28px; height: 28px; }
</style>
</head>
<body>

<div class="phone">
  <div class="phone__notch"></div>
  <div class="phone__screen">

    <div class="status-bar">
      <span>9:41</span>
      <div class="status-bar__right">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M0 6.5L2 4.5L4 6.5L6 4.5L8 6.5L10 4.5L12 6.5L14 4.5L16 6.5V10H0V6.5Z" fill="currentColor" opacity=".85"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.5" y="0.5" width="18" height="10" rx="2" stroke="currentColor" opacity=".85"/><rect x="2" y="2" width="14" height="7" rx="1" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="scroll">

      <header class="cr-header">
        <span class="score-pill">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          30 <span class="pt">PT</span>
        </span>
        <div style="display:flex; align-items:center; gap:6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-dim);"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
          <span class="timer">22:41</span>
        </div>
        <button class="icon-btn" aria-label="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        </button>
      </header>

      <div class="cr-progress">
        <div class="cr-progress__bar"><div></div></div>
        <div class="cr-progress__meta">
          <span>STOP 2 / 5</span>
          <span>Altstadt-Tour</span>
        </div>
      </div>

      <div class="cr-map-card">
        <svg class="cr-map-svg" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="360" height="200" fill="#11100e"/>
          <rect width="360" height="200" fill="url(#grid)"/>
          <path d="M 40 160 Q 110 130 160 130 T 260 80 T 330 50" stroke="rgba(232,95,30,0.45)" stroke-width="2" fill="none" stroke-dasharray="4 5"/>
          <circle cx="40" cy="160" r="8" fill="#5AA0FF" opacity="0.4"/>
          <circle cx="40" cy="160" r="4" fill="#5AA0FF"/>
          <circle cx="260" cy="80" r="38" fill="rgba(232,95,30,0.10)" stroke="rgba(232,95,30,0.5)" stroke-width="1"/>
          <circle cx="260" cy="80" r="5" fill="#E85F1E"/>
          <path d="M260 60 L264 78 L274 80 L266 84 L268 96 L260 90 L252 96 L254 84 L246 80 L256 78 Z" fill="#E85F1E" opacity="0.0"/>
          <g transform="translate(255,55)">
            <path d="M5 0 L5 20" stroke="#E85F1E" stroke-width="2"/>
            <path d="M5 0 L18 4 L5 8 Z" fill="#E85F1E"/>
          </g>
        </svg>
        <div class="arrived-pill"><span class="dot"></span> 42 m away</div>
      </div>

      <div class="cr-mission">
        <div class="step">Stop 2 of 5</div>
        <h3>Skulptur-Rätsel</h3>
        <p class="desc">Vor dem Rathaus steht eine bronzene Skulptur einer mythischen Figur.</p>
        <div class="task"><span class="arrow">→</span><span>Welches Tier hält die Figur in der Hand? Antwortet schriftlich.</span></div>
        <div class="meta-row">
          <span class="pill pill--orange">ANSWER REQUIRED</span>
          <span class="pill">40 PT</span>
          <span class="pill">GPS · 25 m</span>
        </div>
      </div>

      <div class="cr-actions">
        <button class="btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Type answer
        </button>
        <button class="btn btn--primary">
          Take photo
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11Z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
      </div>

      <div class="cr-hints">
        <div class="ht-row">
          <span class="ht-title">Hints</span>
          <span class="ht-count">2 left</span>
        </div>
        <span class="ht-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.7.5 1 1.3 1 2.1V18h6v-1.2c0-.8.3-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
          Reveal hint · −5 PT
        </span>
      </div>

    </div>

    <div class="action-bar">
      <button class="nav-btn" aria-label="Map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </button>
      <button class="camera-btn" aria-label="Open camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11Z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button class="nav-btn" aria-label="Special missions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 4 4 14 11 14 11 20 20 10 13 10 13 4"/></svg>
      </button>
    </div>

    <div class="phone__indicator"></div>
  </div>
</div>

</body>
</html>
