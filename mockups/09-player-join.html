<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MiSSiONS — Player join (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_shared.css">
<style>
  body { display:flex; align-items:center; justify-content:center; padding: 40px 20px; }

  .join-header {
    padding: 60px 24px 18px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .join-header .stamp { font: 700 9px/1 var(--body); letter-spacing: 0.32em; text-transform: uppercase; color: var(--text-dim); }
  .join-header .wordmark { font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: 0.06em; color: var(--text); }
  .join-header .game-id { font: 600 11px/1 var(--mono); color: var(--text-muted); letter-spacing: 0.04em; margin-top: 6px; padding: 6px 12px; border: 1px solid var(--hairline); border-radius: 999px; background: var(--surface); }

  .join-body { padding: 22px 22px 28px; display: flex; flex-direction: column; gap: 22px; }
  .join-body .lead { font: 500 13px/1.55 var(--body); color: var(--text-dim); text-align: center; padding: 0 16px; }

  .selfie-square {
    width: 168px; height: 168px;
    margin: 0 auto;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 38%, rgba(255,255,255,0.06), transparent 60%),
      var(--surface);
    border: 1px dashed var(--hairline);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-muted);
    gap: 8px;
    position: relative;
  }
  .selfie-square svg { width: 38px; height: 38px; }
  .selfie-square .label { font: 600 10px/1 var(--body); letter-spacing: 0.22em; text-transform: uppercase; }
  .selfie-square .badge {
    position: absolute; bottom: 6px; right: 6px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px -8px var(--orange);
  }
  .selfie-square .badge svg { width: 18px; height: 18px; color: #fff; }

  .name-field {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
    padding: 14px 16px;
  }
  .name-field .label { font: 700 10px/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .name-field input {
    width: 100%;
    background: transparent;
    border: 0;
    color: var(--text);
    font: 700 22px/1.1 var(--display);
    letter-spacing: 0.04em;
    outline: none;
    text-transform: uppercase;
  }
  .name-field input::placeholder { color: var(--text-muted); text-transform: uppercase; font-family: var(--display); letter-spacing: 0.04em; }

  .lang-picker {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
  }

  .join-cta {
    padding: 18px 18px 36px;
    display: flex; gap: 10px;
  }
  .join-cta .btn { flex: 1; padding: 14px 20px; font-size: 13px; }
</style>
</head>
<body>

<div class="phone">
  <div class="phone__notch"></div>
  <div class="phone__screen">

    <div class="status-bar">
      <span>9:41</span>
      <div class="status-bar__right">
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M0 6.5L2 4.5L4 6.5L6 4.5L8 6.5L10 4.5L12 6.5L14 4.5L16 6.5V10H0V6.5Z" fill="currentColor" opacity=".85"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.5" y="0.5" width="18" height="10" rx="2" stroke="currentColor" opacity=".85"/><rect x="2" y="2" width="14" height="7" rx="1" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="scroll">

      <header class="join-header">
        <div class="stamp">Adventurerooms</div>
        <div class="wordmark">MiSSiONS</div>
        <div class="game-id">GAME · 2037E32C</div>
      </header>

      <div class="join-body">
        <p class="lead">Take a selfie and pick a team name. Other teams will see your selfie on the rankings.</p>

        <div class="selfie-square">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11Z"/><circle cx="12" cy="13" r="4"/></svg>
          <div class="label">Tap to capture</div>
          <span class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </span>
        </div>

        <div class="name-field">
          <div class="label">Team name</div>
          <input type="text" placeholder="Type a team name…" value="Team Phoenix">
        </div>

        <div>
          <div class="field-label" style="text-align: center;">Language</div>
          <div class="lang-picker">
            <span class="lang-tab is-active">DE</span>
            <span class="lang-tab">EN</span>
            <span class="lang-tab">FR</span>
            <span class="lang-tab">IT</span>
            <span class="lang-tab">ES</span>
          </div>
        </div>
      </div>

    </div>

    <div class="join-cta">
      <button class="btn btn--primary btn--full">
        Join game
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
      </button>
    </div>

    <div class="phone__indicator"></div>
  </div>
</div>

</body>
</html>
