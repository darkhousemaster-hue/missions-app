<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MiSSiONS — GM game-select (mockup)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_shared.css">
<style>
  body { display:flex; align-items:center; justify-content:center; padding: 40px 20px; min-height: 100vh; }

  .gs-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .gs-back { color: var(--text-dim); }

  .gs-form-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
    padding: 22px 22px 24px;
    display: flex; flex-direction: column; gap: 16px;
    margin-bottom: 32px;
  }
  .gs-form-card .row-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .gs-form-card .label-mute { color: var(--text-muted); font-weight: 500; text-transform: none; letter-spacing: 0; }

  .gs-list-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 12px;
  }
  .gs-list-head .title {
    font: 700 11px/1 var(--body);
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .gs-list-head .count {
    font: 500 12px/1 var(--mono);
    color: var(--text-muted);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .game-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--r-card);
    padding: 16px 16px 14px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .game-card:hover {
    border-color: rgba(255,255,255,0.18);
    background: var(--surface-2);
    transform: translateY(-1px);
  }
  .game-card__id {
    font: 600 14px/1 var(--mono);
    color: var(--text);
    letter-spacing: 0.02em;
  }
  .game-card__date {
    font: 500 12px/1 var(--body);
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .game-card__meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .game-card__actions { display: flex; gap: 6px; margin-top: 6px; }
  .game-card__actions .btn { padding: 8px 10px; font-size: 12px; }
  .game-card__actions .btn--primary { flex: 1; }
  .game-card__actions .icon-only { width: 36px; padding: 0; }
</style>
</head>
<body>

<div class="desktop">
  <div class="desktop__chrome">
    <span class="dot dot--red"></span><span class="dot dot--yel"></span><span class="dot dot--grn"></span>
    <span class="url">gm.advrm.local / GAME-SELECT</span>
    <span class="spacer"></span>
    <span class="mono">altstadt</span>
  </div>

  <div class="desktop__body">
    <div class="dt-scroll">
      <div class="dt-narrow">

        <div class="gs-head">
          <div>
            <div class="kicker">Location</div>
            <h1 class="title-xl">Altstadt</h1>
          </div>
          <button class="btn btn--ghost gs-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
        </div>

        <!-- MiSSiONS context: a single Game-mode select. CityRush has its
             own entry point on the landing page, so there's no "optional
             CityRush" field bolted on here — the two modes are exclusive. -->
        <div class="gs-form-card">
          <div>
            <div class="field-label">Game mode</div>
            <select class="select">
              <option>STANDARD</option>
              <option>ADVANCED</option>
            </select>
          </div>
          <button class="btn btn--primary btn--lg btn--full">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New game
          </button>
        </div>

        <div class="gs-list-head">
          <span class="title">Recent games</span>
          <span class="count">4</span>
        </div>

        <div class="games-grid">

          <article class="game-card">
            <div class="game-card__id">2037E32C</div>
            <div class="game-card__date">Apr 14 · 14:32</div>
            <div class="game-card__meta">
              <span class="pill pill--green">running</span>
              <span class="pill">STANDARD</span>
            </div>
            <div class="game-card__actions">
              <button class="btn btn--primary">
                Open
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
              </button>
              <button class="btn icon-only" aria-label="QR">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/><rect x="14" y="14" width="2" height="2"/></svg>
              </button>
              <button class="btn icon-only" aria-label="Delete" style="color:var(--red); border-color: rgba(224,72,72,0.35);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          </article>

          <article class="game-card">
            <div class="game-card__id">9C18A24F</div>
            <div class="game-card__date">Apr 12 · 09:14</div>
            <div class="game-card__meta">
              <span class="pill">waiting</span>
              <span class="pill">STANDARD</span>
            </div>
            <div class="game-card__actions">
              <button class="btn btn--primary">
                Open
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
              </button>
              <button class="btn icon-only" aria-label="QR">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/><rect x="14" y="14" width="2" height="2"/></svg>
              </button>
              <button class="btn icon-only" aria-label="Delete" style="color:var(--red); border-color: rgba(224,72,72,0.35);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          </article>

          <article class="game-card">
            <div class="game-card__id">7AE5B201</div>
            <div class="game-card__date">Apr 06 · 18:00</div>
            <div class="game-card__meta">
              <span class="pill">ended</span>
              <span class="pill">ADVANCED</span>
            </div>
            <div class="game-card__actions">
              <button class="btn btn--primary">
                Open
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>
              </button>
              <button class="btn icon-only" aria-label="QR">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/><rect x="14" y="14" width="2" height="2"/></svg>
              </button>
              <button class="btn icon-only" aria-label="Delete" style="color:var(--red); border-color: rgba(224,72,72,0.35);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          </article>

        </div>

      </div>
    </div>
  </div>
</div>

</body>
</html>
